<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Социальный Лифт</title>

  <!-- Adsgram -->
  <script src="https://adsgram.ai/assets/js/adsgram.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#0a0a0a;color:#fff;overflow-x:hidden;
    }
    #app{max-width:420px;margin:0 auto;min-height:100vh;background:#161616;position:relative}

    /* Onboarding */
    .onboarding{
      position:fixed;inset:0;background:#000;z-index:4000;
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      padding:2rem;text-align:center;
    }
    .onboarding-text{font-size:1.25rem;margin-bottom:1.8rem;animation:fadeIn .7s ease-out}
    .notification-box{width:100%;max-width:300px}
    .notification{
      background:#1f1f1f;padding:1rem 1.2rem;border-radius:12px;margin:.5rem 0;
      border-left:3px solid #ff4444;animation:slideUp .45s ease-out forwards;opacity:0;
    }
    .notification:nth-child(1){animation-delay:.2s}
    .notification:nth-child(2){animation-delay:.45s}
    .notification:nth-child(3){animation-delay:.7s}
    .notification:nth-child(4){animation-delay:.95s}
    .notif-title{font-size:.82rem;color:#888;margin-bottom:.25rem}
    .notif-text{font-size:1.05rem;font-weight:800}
    .start-btn{
      margin-top:1.6rem;padding:1.1rem 2.8rem;background:#00ff88;color:#000;border:none;
      border-radius:12px;font-size:1.05rem;font-weight:800;cursor:pointer;
      animation:slideUp .45s ease-out 1.2s forwards;opacity:0;
    }
    .start-btn:active{transform:scale(.97)}

    /* Top bar (HOME only: hunger/charge/level) */
    .top-bar{
      position:fixed;top:12px;left:50%;transform:translateX(-50%);
      width:calc(100% - 24px);max-width:396px;
      background:rgba(31,31,31,.92);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.12);border-radius:18px;
      padding:.7rem .9rem;z-index:300;display:flex;gap:.8rem;justify-content:space-between;
    }
    .top-item{display:flex;align-items:center;gap:.35rem;font-weight:700;font-size:.9rem;color:#ddd}
    .bar{width:72px;height:8px;background:#333;border-radius:999px;overflow:hidden}
    .bar > div{height:100%;background:#00ff88;width:50%}

    /* Scene */
    .scene{
      min-height:100vh;
      background-size:cover;background-position:center;
      display:flex;align-items:center;justify-content:center;position:relative;
      overflow:hidden;padding:2rem;
    }
    .scene::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.72) 100%);
      z-index:1;
    }
    .scene-content{z-index:2;text-align:center;max-width:340px}
    .scene-title{font-size:2.1rem;font-weight:900;margin-bottom:.9rem;text-shadow:0 2px 24px rgba(0,0,0,.9)}
    .scene-desc{font-size:1.03rem;line-height:1.6;color:#f2f2f2;margin-bottom:1.2rem;text-shadow:0 1px 12px rgba(0,0,0,.85)}
    .scene-hint{
      padding:1rem;background:rgba(0,0,0,.52);backdrop-filter:blur(10px);
      border-radius:14px;border:1px solid rgba(255,255,255,.1);
      font-size:.95rem;color:#ddd;font-style:italic;
    }

    /* One main button on HOME */
    .action-area{
      position:absolute;left:0;right:0;bottom:92px;z-index:2;padding:0 1.2rem;
    }
    .main-btn{
      width:100%;padding:1.15rem;background:#00ff88;color:#000;border:none;border-radius:14px;
      font-size:1.05rem;font-weight:900;cursor:pointer;
      box-shadow:0 6px 26px rgba(0,255,136,.28);
    }
    .main-btn:active{transform:scale(.98)}
    .main-btn:disabled{background:#333;color:#666;box-shadow:none;cursor:not-allowed}

    /* Small “reality actions” on HOME (cafe) */
    .home-quick{
      position:fixed;top:66px;right:14px;z-index:310;
      display:flex;flex-direction:column;gap:.55rem;
    }
    .qbtn{
      background:rgba(31,31,31,.92);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.12);color:#fff;
      border-radius:14px;padding:.65rem .85rem;font-size:.82rem;font-weight:700;
      cursor:pointer;display:flex;align-items:center;gap:.45rem;
    }
    .qbtn:disabled{opacity:.5;cursor:not-allowed}
    .qbtn small{color:#aaa;font-weight:700}

    /* Bottom nav */
    .nav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      max-width:420px;width:100%;
      background:#1f1f1f;border-top:1px solid #2a2a2a;
      display:flex;z-index:250;
    }
    .nav-item{
      flex:1;border:none;background:transparent;color:#666;
      display:flex;flex-direction:column;align-items:center;gap:.25rem;
      padding:.75rem .45rem;font-size:.7rem;font-weight:800;cursor:pointer;
    }
    .nav-item.active{color:#00ff88}
    .nav-icon{font-size:1.45rem}

    /* Phone Feed overlay */
    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:3500;
      display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease-out;
    }
    .phone{
      width:360px;height:720px;background:#000;border-radius:40px;
      border:8px solid #1a1a1a;position:relative;overflow:hidden;
      box-shadow:0 20px 70px rgba(0,0,0,.85);
    }
    .phone-notch{
      position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:120px;height:28px;background:#000;border-radius:0 0 20px 20px;z-index:10;
    }
    .close-phone{
      position:absolute;top:48px;right:12px;width:40px;height:40px;border:none;
      border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);
      color:#fff;font-size:1.45rem;cursor:pointer;z-index:11;
      display:flex;align-items:center;justify-content:center;
    }
    .phone-content{
      height:100%;padding:40px 1rem 1rem;overflow:hidden;
      display:flex;flex-direction:column;gap:1rem;
    }
    .feed-card{
      background:#161616;border:1px solid #2a2a2a;border-radius:18px;
      padding:1.4rem;animation:slideUp .25s ease-out;
      flex:1;display:flex;flex-direction:column;justify-content:center;
    }
    .feed-emoji{font-size:3.1rem;text-align:center;margin-bottom:1rem}
    .feed-text{font-size:1.02rem;text-align:center;line-height:1.55;color:#e4e4e4;margin-bottom:1.2rem}
    .feed-btns{display:flex;gap:.5rem}
    .feed-btn{
      flex:1;padding:.85rem;border-radius:10px;border:2px solid #333;
      background:transparent;color:#fff;font-weight:900;font-size:.85rem;
      cursor:pointer;transition:.15s;
    }
    .feed-btn:hover{border-color:#00ff88;background:rgba(0,255,136,.08)}
    .feed-btn.primary{background:#00ff88;color:#000;border-color:#00ff88}
    .feed-hint{text-align:center;color:#777;font-size:.9rem;font-style:italic}

    /* Screens (Status/Business) */
    .screen{padding:1.2rem;padding-top:4.5rem;padding-bottom:92px;min-height:100vh}
    .title{font-size:1.7rem;font-weight:900;margin-bottom:1rem}
    .card{background:#1f1f1f;border:1px solid #2a2a2a;border-radius:16px;padding:1.2rem;margin-bottom:.9rem}
    .card h3{font-size:.86rem;color:#888;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.7rem}
    .big{font-size:1.8rem;font-weight:900;color:#00ff88}
    .muted{color:#9a9a9a;font-size:.92rem;line-height:1.5}

    .pillrow{display:flex;flex-wrap:wrap;gap:.5rem}
    .pill{
      padding:.55rem .7rem;border-radius:999px;border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);font-weight:800;font-size:.8rem;color:#ddd;
    }

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .hidden{display:none!important}
  </style>
</head>

<body>
<div id="app"></div>

<script>
/** ============================
 *  STATE + SAVE/LOAD
 *  ============================ */
const STORAGE_KEY = "socialLift_v2";

const defaultState = () => ({
  screen: "onboarding",
  onboardingStep: 0,

  // HOME (only show hunger/charge/level)
  hunger: 10,         // 0..100 (0 = сытый, 100 = голодный)
  charge: 100,        // 0..100
  level: 1,

  // Hidden on HOME, shown in STATUS
  money: 0,
  degradation: 0,     // 0..100
  concentration: 60,  // 0..100
  chaos: 20,          // 0..100
  authority: 0,       // 0..100 (для будущего)
  city: 0,            // 0..N

  home: "none",       // none/basement/room/flat/...
  day: 1,             // игровая “дата”

  // Feed
  showPhone: false,
  feedClicks: 0,
  currentFeedCard: null,   // ВАЖНО: чтобы не обновлялась сама
  firstCourseOffered: false,
  selectedCourse: null,

  // Skills
  skills: {
    tech: { level: 0, xp: 0, unlocked: false },
    music:{ level: 0, xp: 0, unlocked: false },
    sport:{ level: 0, xp: 0, unlocked: false },
    politics:{ level: 0, xp: 0, unlocked: false }
  },

  // Daily freebies (cafe)
  lastDayKey: null,
  freeChargeLeft: 2,
  freeFoodLeft: 1,

  // Ads rewards (daily)
  adsChargeLeft: 3,
  adsFoodLeft: 3,

  // Crypto Guess (daily) — без денег, только бонусы
  cryptoDateKey: null,
  cryptoStreak: 0,
  incomeBoostUntil: 0,    // timestamp ms
  incomeBoostMult: 1,

  lastUpdate: Date.now()
});

let state = defaultState();

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    state = Object.assign(defaultState(), parsed);
    state.lastUpdate = Date.now();
  } catch(e) {}
}

/** ============================
 *  CONTENT
 *  ============================ */
const scenes = {
  none: {
    title: "Улица",
    desc: "Ты сидишь на картонке у кафе. В руках телефон. Рядом розетка и Wi-Fi.",
    hint: "Ты нашёл розетку и Wi-Fi."
  },
  basement: {
    title: "Подвал",
    desc: "Сырой подвал с лампой. Не мечта, но уже своё место.",
    hint: "Тут можно учиться без ветра и дождя."
  }
};

const feedData = {
  trash: [
    { text: "15 лайфхаков как стать миллионером за неделю", emoji: "💸" },
    { text: "Смотри как он танцует! Невероятно!", emoji: "🕺" },
    { text: "Этот трюк шокирует даже врачей!", emoji: "😱" },
    { text: "Подпишись на курс «Успех за 3 дня»", emoji: "🎯" },
    { text: "Гороскоп: тебя ждёт удача… может быть", emoji: "🔮" },
    { text: "Залипательное видео: краска сохнет", emoji: "🎨" },
    { text: "Купи курс у эксперта с 2 месяцами опыта", emoji: "🤡" }
  ],
  neutral: [
    { text: "Милый котик играет с коробкой", emoji: "🐱" },
    { text: "Рецепт идеальной пасты карбонара", emoji: "🍝" },
    { text: "Красивый закат над городом", emoji: "🌇" },
    { text: "Как правильно заваривать чай", emoji: "☕" },
    { text: "Интересные факты о космосе", emoji: "🌌" }
  ],
  triggers: [
    { text: "Бесплатный курс: веб-разработка", emoji: "💻", branch: "tech" },
    { text: "Музыкальный баттл сегодня вечером", emoji: "🎵", branch: "music" },
    { text: "Открытая тренировка на турниках рядом", emoji: "🏋️", branch: "sport" },
    { text: "Нужны помощники на общественную инициативу", emoji: "🏛️", branch: "politics" }
  ],
  specials: [
    { text: "📈 Crypto Guess: BTC сегодня вверх или вниз?", emoji: "📈", type: "crypto" }
  ]
};

const courses = [
  { key: "tech", emoji: "💻", name: "Технологии", desc: "Основы (потом откроется PenTest и т.д.)" },
  { key: "music", emoji: "🎵", name: "Музыка", desc: "Направления: рэп/поп/битмейкинг и т.д." },
  { key: "sport", emoji: "🏋️", name: "Спорт", desc: "Подветки: турники/зал/бокс/борьба…" },
  { key: "politics", emoji: "🏛️", name: "Политика/Legal", desc: "От модерации текстов до юриста/лидера" }
];

/** ============================
 *  TIME + DAILY RESET
 *  ============================ */
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function ensureDailyReset() {
  const key = todayKey();
  if (state.lastDayKey === key) return;
  state.lastDayKey = key;
  state.freeChargeLeft = 2;
  state.freeFoodLeft = 1;
  state.adsChargeLeft = 3;
  state.adsFoodLeft = 3;
}

function tickNeeds(deltaSec) {
  // базовая деградация “от времени”
  state.hunger = Math.min(100, state.hunger + deltaSec * 0.20); // голод растёт
  state.charge = Math.max(0, state.charge - deltaSec * 0.12);  // заряд уходит
  // небольшое восстановление деградации, если не скроллит бесконечно
  state.degradation = Math.max(0, state.degradation - deltaSec * 0.01);
}

/** ============================
 *  FEED (FIX: card is stable until action)
 *  ============================ */
function rollFeedCard() {
  // 5-й клик — первый курс (как у тебя)
  if (state.feedClicks === 4 && !state.firstCourseOffered) {
    return { text: "🎓 Бесплатный курс по…", emoji: "🎓", type: "first-course" };
  }

  // иногда кидаем crypto guess как “событие” (если доступно и не сыграно сегодня)
  const canCrypto = state.cryptoUnlocked() && state.cryptoDateKey !== todayKey();
  const cryptoChance = canCrypto ? 12 : 0;

  const rand = Math.random() * 100;

  // деградация делает больше мусора :contentReference[oaicite:2]{index=2}
  const trashBias = state.degradation * 0.35;
  const triggerBias = Math.max(0, 18 - state.degradation * 0.15);

  if (canCrypto && rand < cryptoChance) {
    return { ...feedData.specials[0] };
  }

  if (rand < 50 + trashBias) {
    return { ...pick(feedData.trash), type: "trash" };
  } else if (rand < 80 + trashBias) {
    return { ...pick(feedData.neutral), type: "neutral" };
  } else if (rand < 95 + trashBias - triggerBias) {
    return { ...pick(feedData.triggers), type: "trigger" };
  } else {
    return { ...pick(feedData.neutral), type: "neutral" };
  }
}

function ensureFeedCard() {
  if (!state.currentFeedCard) state.currentFeedCard = rollFeedCard();
}

function nextFeedCard() {
  state.currentFeedCard = rollFeedCard();
}

/** ============================
 *  ADSGRAM (reward: food or charge)
 *  ============================ */
function showAdReward(kind) {
  ensureDailyReset();

  if (kind === "charge" && state.adsChargeLeft <= 0) return alert("🎥 Реклама на заряд закончилась на сегодня.");
  if (kind === "food" && state.adsFoodLeft <= 0) return alert("🎥 Реклама на еду закончилась на сегодня.");

  if (!window.Adsgram || !window.Adsgram.init) {
    alert("Adsgram не загрузился. Проверь, что это запускается внутри Telegram и скрипт доступен.");
    return;
  }

  const AdController = window.Adsgram.init({ blockId: "21029" });

  AdController.show().then(() => {
    if (kind === "charge") {
      state.charge = 100;
      state.adsChargeLeft--;
      alert("⚡ Спасибо! Телефон заряжен.");
    } else {
      state.hunger = Math.max(0, state.hunger - 70);
      state.adsFoodLeft--;
      alert("🍔 Спасибо! Ты поел.");
    }
    render();
  }).catch((result) => {
    console.log("Реклама пропущена/ошибка:", result);
    // награду не даём
  });
}

/** ============================
 *  GAME ACTIONS
 *  ============================ */
function startGame() {
  state.screen = "home";
  state.onboardingStep = 0;
  state.money = 0;
  state.level = 1;
  state.home = "none";
  state.hunger = 10;
  state.charge = 100;
  state.degradation = 0;
  state.concentration = 60;
  state.chaos = 20;
  state.authority = 0;
  state.feedClicks = 0;
  state.currentFeedCard = null;
  state.firstCourseOffered = false;
  state.selectedCourse = null;
  Object.keys(state.skills).forEach(k => state.skills[k] = { level:0, xp:0, unlocked:false });
  ensureDailyReset();
  render();
}

function openFeed() {
  if (state.charge < 5) return;
  state.showPhone = true;
  ensureFeedCard();
  render();
}
function closeFeed() { state.showPhone = false; render(); }

function feedClick(action) {
  // любое действие в ленте = клик
  state.feedClicks++;
  // деградация растёт от скролла :contentReference[oaicite:3]{index=3}
  state.charge = Math.max(0, state.charge - 2);
  state.degradation = Math.min(100, state.degradation + 3);
  state.concentration = Math.max(0, state.concentration - 1);
  state.chaos = Math.min(100, state.chaos + 2);
  state.hunger = Math.min(100, state.hunger + 0.7);

  const card = state.currentFeedCard;

  if (card.type === "first-course") {
    // открываем выбор курса
    state.showCoursePicker = true;
    render();
    return;
  }

  if (card.type === "trigger" && card.branch) {
    if (!state.skills[card.branch].unlocked) {
      state.skills[card.branch].unlocked = true;
      state.selectedCourse = state.selectedCourse || card.branch;
      alert(`🎯 Открыт путь: ${skillName(card.branch)}!`);
      // лёгкий “буст” за шанс
      state.authority = Math.min(100, state.authority + 2);
    }
  }

  if (card.type === "crypto") {
    // открываем crypto guess экран внутри ленты (карточка сменится на вариант)
    state.showCrypto = true;
    render();
    return;
  }

  // IMPORTANT: карточка обновляется ТОЛЬКО ПОСЛЕ клика
  nextFeedCard();
  render();
}

function chooseCourse(key) {
  state.selectedCourse = key;
  state.skills[key].unlocked = true;
  state.firstCourseOffered = true;
  state.showCoursePicker = false;

  alert(`✨ Выбран путь: ${skillName(key)}.\nТеперь прокачка будет появляться дальше через ленту и статус.`);
  // после выбора курса — новая карточка
  nextFeedCard();
  render();
}

/** ============================
 *  SKILL TRAIN (simple prototype)
 *  ============================ */
function trainSelectedSkill() {
  if (!state.selectedCourse) return alert("Открой курс через ленту.");
  if (state.hunger > 25) return alert("🍔 Слишком голоден. Поешь (кафе/реклама).");
  if (state.charge < 5) return alert("🔋 Мало заряда.");

  const s = state.skills[state.selectedCourse];

  const eff = Math.max(0.25, 1 - (state.degradation/180) - (state.hunger/220));
  const gain = Math.floor((2 + Math.random()*3) * eff);

  s.xp += gain;
  state.charge = Math.max(0, state.charge - 1.2);
  state.hunger = Math.min(100, state.hunger + 1.0);
  state.degradation = Math.min(100, state.degradation + 0.6);

  const need = 100 + s.level*120;
  if (s.xp >= need) {
    s.xp -= need;
    s.level++;
    state.level++;

    // деньги растут с уровнем (как ты хотел: “каждый уровень +$1”)
    state.money += 1;

    // “первый заработок” — позже здесь будут работы 100 кликов = $…
    alert(`🎉 Уровень навыка: ${s.level}\n⭐ Общий уровень: ${state.level}\n+$1 (теперь у тебя ${state.money}$)`);

    // пример смены дома (очень рано, чисто чтобы проверить механику сцен)
    if (state.level === 5) state.home = "basement";
  }
  render();
}

/** ============================
 *  CRYPTO GUESS (daily, no money bet)
 *  ============================ */
state.cryptoUnlocked = () => {
  // для прототипа: откроем после skill lvl 3 в любой ветке
  return Object.values(state.skills).some(s => s.level >= 3);
};

function cryptoGuess(dir) {
  const key = todayKey();
  if (state.cryptoDateKey === key) return alert("📈 Сегодня ты уже делал прогноз.");

  // “обычный успех 92%, x2 5%, x3 3%, x10 0.001%” как у тебя :contentReference[oaicite:4]{index=4}
  // но это множители бонусов, не деньги :contentReference[oaicite:5]{index=5}
  const roll = Math.random() * 100;
  let mult = 1;
  if (roll < 0.001) mult = 10;
  else if (roll < 3.001) mult = 3;
  else if (roll < 8.001) mult = 2;

  // Сам “рынок” — 50/50 направление (можно позже привязать к реальным данным)
  const actual = Math.random() > 0.5 ? "up" : "down";
  const win = (dir === actual);

  if (win) {
    state.cryptoStreak++;
    const boostMinutes = mult === 10 ? 10 : (mult === 3 ? 30 : (mult === 2 ? 60 : 30));
    state.incomeBoostMult = 1 + (mult === 10 ? 10 : mult === 3 ? 2 : mult === 2 ? 1 : 0.3);
    state.incomeBoostUntil = Date.now() + boostMinutes*60*1000;

    // бонус: опыт в выбранный навык
    if (state.selectedCourse) state.skills[state.selectedCourse].xp += 30*mult;

    alert(mult > 1
      ? `🔥 Удача на твоей стороне! x${mult}\nБуст дохода: x${state.incomeBoostMult.toFixed(1)} на ${boostMinutes} мин.`
      : "✅ Рынок на твоей стороне. Небольшой буст!");
  } else {
    state.cryptoStreak = 0;
    alert("😄 Рынок снова показал характер. Никаких штрафов.");
  }

  state.cryptoDateKey = key;
  state.showCrypto = false;
  nextFeedCard();
  render();
}

/** ============================
 *  FREE CAFE ACTIONS + ADS
 *  ============================ */
function freeCharge() {
  ensureDailyReset();
  if (state.freeChargeLeft <= 0) return alert("⚡ Бесплатные зарядки на сегодня закончились.");
  state.charge = 100;
  state.freeChargeLeft--;
  render();
}
function freeFood() {
  ensureDailyReset();
  if (state.freeFoodLeft <= 0) return alert("🍔 Бесплатная еда на сегодня закончилась.");
  state.hunger = Math.max(0, state.hunger - 70);
  state.freeFoodLeft--;
  render();
}

/** ============================
 *  NAV
 *  ============================ */
function navigate(screen) {
  state.screen = screen;
  // лента закрывается при смене экрана
  state.showPhone = false;
  render();
}

/** ============================
 *  UI HELPERS
 *  ============================ */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
function pctBar(value0to100){ return clamp(Math.round(value0to100),0,100); }
function hungerShown(){ return 100 - Math.floor(state.hunger); } // сытость %
function skillName(key){
  return ({tech:"Технологии",music:"Музыка",sport:"Спорт",politics:"Политика/Legal"})[key] || key;
}
function fmtTimeLeft(ts){
  const ms = ts - Date.now();
  if (ms <= 0) return "0м";
  const m = Math.ceil(ms/60000);
  return `${m}м`;
}

/** ============================
 *  RENDER
 *  ============================ */
function render() {
  ensureDailyReset();
  saveState();

  const app = document.getElementById("app");

  // Onboarding flow (мемный слив депо)
  if (state.screen === "onboarding") {
    const step = state.onboardingStep;

    if (step === 0) {
      app.innerHTML = `<div class="onboarding"><div class="onboarding-text">Ты решил заняться трейдингом…</div></div>`;
      setTimeout(() => { state.onboardingStep = 1; render(); }, 1600);
      return;
    }
    if (step === 1) {
      app.innerHTML = `
        <div class="onboarding">
          <div class="notification-box">
            <div class="notification"><div class="notif-title">Binance</div><div class="notif-text">Маржин-колл</div></div>
            <div class="notification"><div class="notif-title">Binance</div><div class="notif-text">Ликвидация</div></div>
            <div class="notification"><div class="notif-title">Telegram</div><div class="notif-text">Бро, ты жив?</div></div>
            <div class="notification"><div class="notif-title">Баланс</div><div class="notif-text">0.00 USDT</div></div>
          </div>
        </div>`;
      setTimeout(() => { state.onboardingStep = 2; render(); }, 2600);
      return;
    }
    if (step === 2) {
      app.innerHTML = `<div class="onboarding"><div class="onboarding-text">…и рынок решил иначе.</div></div>`;
      setTimeout(() => { state.onboardingStep = 3; render(); }, 1500);
      return;
    }
    app.innerHTML = `
      <div class="onboarding">
        <div style="font-size:5.8rem;margin-bottom:1.3rem;">📦</div>
        <div class="onboarding-text">Добро пожаловать обратно в реальность.</div>
        <div style="font-size:.92rem;color:#666;">Зато опыт есть. 😄</div>
        <button class="start-btn" onclick="startGame()">Начать заново</button>
      </div>`;
    return;
  }

  // Common parts
  const topBar = (state.screen === "home")
    ? renderTopBar()
    : ""; // на других экранах — по желанию можно показывать иначе

  // HOME
  if (state.screen === "home") {
    const sc = scenes[state.home] || scenes.none;
    const canOpen = state.charge >= 5;

    const hint = state.charge < 20 ? "⚡ Экран тускнеет."
      : state.hunger > 70 ? "🍔 Живот урчит."
      : sc.hint;

    app.innerHTML = `
      ${topBar}
      ${renderHomeQuick()}
      <div class="scene" style="background-image:url('https://dragonlors.github.io/test/image/fon1.png');">
        <div class="scene-content">
          <div class="scene-title">${sc.title}</div>
          <div class="scene-desc">${sc.desc}</div>
          <div class="scene-hint">${hint}</div>
        </div>
        <div class="action-area">
          <button class="main-btn" ${!canOpen ? "disabled":""} onclick="openFeed()">
            ${canOpen ? "ОТКРЫТЬ ЛЕНТУ" : "Недостаточно заряда"}
          </button>
        </div>
      </div>
      ${renderNav()}
    `;

  } else if (state.screen === "feed") {
    // отдельный “экран ленты” (вместо overlay можно оставить overlay, но тут удобно по меню)
    app.innerHTML = `
      <div class="screen">
        <div class="title">Лента</div>
        <div class="card">
          <h3>Как работает</h3>
          <div class="muted">
            Лента = хаос, деградация, триггеры и возможности. Открывай её на HOME.
          </div>
          <button class="main-btn" style="margin-top:1rem" onclick="openFeed()">Открыть ленту</button>
        </div>
      </div>
      ${renderNav()}
    `;

  } else if (state.screen === "status") {
    const boostOn = Date.now() < state.incomeBoostUntil;
    app.innerHTML = `
      <div class="screen">
        <div class="title">Статус</div>

        <div class="card">
          <h3>Жизнь</h3>
          <div class="pillrow">
            <div class="pill">⭐ Уровень: ${state.level}</div>
            <div class="pill">🏠 Дом: ${state.home === "none" ? "картонка" : (state.home === "basement" ? "подвал" : state.home)}</div>
            <div class="pill">💰 Деньги: ${state.money}$</div>
            <div class="pill">🧠 Деградация: ${Math.floor(state.degradation)}%</div>
            <div class="pill">🎯 Концентрация: ${Math.floor(state.concentration)}%</div>
            <div class="pill">🌪️ Хаос: ${Math.floor(state.chaos)}%</div>
            <div class="pill">🏆 Авторитет: ${Math.floor(state.authority)}%</div>
          </div>
          <div class="muted" style="margin-top:.8rem">
            ${boostOn
              ? `🔥 Буст дохода активен: x${state.incomeBoostMult.toFixed(1)} ещё ${fmtTimeLeft(state.incomeBoostUntil)}`
              : "Бустов нет. Попробуй Crypto Guess (появляется в ленте)."}
          </div>
        </div>

        <div class="card">
          <h3>Навыки</h3>
          ${renderSkillsList()}
          <button class="main-btn" style="margin-top:.9rem" onclick="trainSelectedSkill()">Прокачать выбранный навык</button>
          <div class="muted" style="margin-top:.7rem">
            В будущем сюда добавим “работы 100 кликов = $”, требования дома/одежды и т.д.
          </div>
        </div>

        <div class="card">
          <h3>Реклама (бонусы)</h3>
          <div class="muted">Можно смотреть рекламу и получать заряд/еду.</div>
          <div style="display:flex;gap:.6rem;margin-top:1rem">
            <button class="feed-btn primary" style="flex:1" onclick="showAdReward('charge')">🎥 ⚡ Заряд</button>
            <button class="feed-btn primary" style="flex:1" onclick="showAdReward('food')">🎥 🍔 Еда</button>
          </div>
          <div class="muted" style="margin-top:.7rem">
            Осталось сегодня: ⚡ ${state.adsChargeLeft} / 🍔 ${state.adsFoodLeft}
          </div>
        </div>

      </div>
      ${renderNav()}
    `;

  } else if (state.screen === "business") {
    app.innerHTML = `
      <div class="screen">
        <div class="title">Бизнес</div>
        <div class="card">
          <h3>Скоро</h3>
          <div class="muted">
            Бизнес откроется позже и будет бесконечно масштабироваться (еженедельно добавляются новые бизнесы).
          </div>
        </div>
      </div>
      ${renderNav()}
    `;
  }

  // Feed overlay (phone)
  if (state.showPhone) {
    ensureFeedCard();
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = renderPhone();
    app.appendChild(overlay);
  }

  // Course picker
  if (state.showCoursePicker) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="phone" style="height:640px">
        <div class="phone-notch"></div>
        <button class="close-phone" onclick="state.showCoursePicker=false; render()">✕</button>
        <div class="phone-content">
          <div class="feed-card" style="justify-content:flex-start">
            <div class="feed-emoji">🎓</div>
            <div class="feed-text"><b>Бесплатный курс!</b><br>Выбери направление.</div>
            <div style="display:flex;flex-direction:column;gap:.6rem">
              ${courses.map(c => `
                <button class="feed-btn primary" onclick="chooseCourse('${c.key}')">
                  ${c.emoji} ${c.name}
                </button>
              `).join("")}
            </div>
            <div class="feed-hint" style="margin-top:1rem">
              Ты не выбираешь из меню — ты натыкаешься на шанс в ленте.
            </div>
          </div>
        </div>
      </div>
    `;
    app.appendChild(overlay);
  }
}

function renderTopBar() {
  const hunger = pctBar(hungerShown());
  const charge = pctBar(state.charge);

  return `
    <div class="top-bar">
      <div class="top-item">🍔 <span>${hunger}%</span>
        <span class="bar"><div style="width:${hunger}%;background:${state.hunger>75?"#ff4444":"#00ff88"}"></div></span>
      </div>
      <div class="top-item">🔋 <span>${charge}%</span>
        <span class="bar"><div style="width:${charge}%"></div></span>
      </div>
      <div class="top-item">⭐ <span>${state.level}</span></div>
    </div>
  `;
}

function renderHomeQuick() {
  return `
    <div class="home-quick">
      <button class="qbtn" onclick="freeCharge()">⚡ <span>Кафе</span> <small>(x${state.freeChargeLeft})</small></button>
      <button class="qbtn" onclick="freeFood()">🍔 <span>Кафе</span> <small>(x${state.freeFoodLeft})</small></button>
      <button class="qbtn" onclick="showAdReward('charge')">🎥⚡ <span>Реклама</span> <small>(x${state.adsChargeLeft})</small></button>
      <button class="qbtn" onclick="showAdReward('food')">🎥🍔 <span>Реклама</span> <small>(x${state.adsFoodLeft})</small></button>
    </div>
  `;
}

function renderSkillsList() {
  const keys = Object.keys(state.skills);
  const unlocked = keys.filter(k => state.skills[k].unlocked);
  if (!unlocked.length) {
    return `<div class="muted">Навыки ещё не открыты. Открой ленту и найди бесплатный курс.</div>`;
  }
  return unlocked.map(k => {
    const s = state.skills[k];
    const need = 100 + s.level*120;
    const pct = Math.round((s.xp/need)*100);
    const isSel = (state.selectedCourse === k);
    return `
      <div class="card" style="background:#171717;border-color:#2a2a2a;margin-top:.6rem">
        <h3>${isSel ? "✅ " : ""}${skillName(k)}</h3>
        <div class="muted">Уровень: <b>${s.level}</b> · XP: ${Math.floor(s.xp)} / ${need}</div>
        <div style="height:8px;background:#333;border-radius:999px;overflow:hidden;margin-top:.7rem">
          <div style="height:100%;width:${clamp(pct,0,100)}%;background:#00ff88"></div>
        </div>
        <div style="display:flex;gap:.6rem;margin-top:.9rem">
          <button class="feed-btn ${isSel ? "primary":""}" onclick="state.selectedCourse='${k}';render()">
            ${isSel ? "Выбран" : "Выбрать"}
          </button>
          <button class="feed-btn" onclick="alert('Дальше: задания/работы/требования дома и одежды — добавим следующим шагом')">
            Детали
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function renderPhone() {
  const card = state.currentFeedCard;

  // кнопки зависят от деградации (оставляем только деградационные слова, как ты хотел)
  let buttons = "";
  if (card.type === "first-course") {
    buttons = `<button class="feed-btn primary" onclick="feedClick('course')">ВЫБРАТЬ КУРС</button>`;
  } else if (card.type === "trigger") {
    buttons = `<button class="feed-btn primary" onclick="feedClick('open')">ОТКРЫТЬ</button>`;
  } else if (card.type === "crypto") {
    buttons = `<button class="feed-btn primary" onclick="feedClick('crypto')">ПОПРОБОВАТЬ</button>`;
  } else {
    buttons = `
      <button class="feed-btn" onclick="feedClick('fa')">ФА</button>
      <button class="feed-btn" onclick="feedClick('pepe')">ПЭПЭ</button>
      <button class="feed-btn" onclick="feedClick('schnela')">ШНЕЛЯ</button>
    `;
  }

  const hint = state.degradation > 60 ? "Голова гудит…"
    : state.degradation > 30 ? "Ты листаешь снова."
    : state.charge < 30 ? "Экран тускнеет."
    : "Время идёт.";

  // Crypto mini overlay inside phone (optional)
  const cryptoPanel = state.showCrypto ? `
    <div class="feed-card" style="margin-top:.8rem;border-color:rgba(0,255,136,.25)">
      <div class="feed-emoji">📉</div>
      <div class="feed-text"><b>Crypto Guess</b><br>BTC сегодня?</div>
      <div class="feed-btns">
        <button class="feed-btn primary" onclick="cryptoGuess('up')">⬆ Вверх</button>
        <button class="feed-btn primary" onclick="cryptoGuess('down')">⬇ Вниз</button>
      </div>
      <div class="feed-hint">${state.cryptoStreak>0 ? `Серия: ${state.cryptoStreak} 🔥` : "А вдруг сегодня твой день 😏"}</div>
    </div>` : "";

  return `
    <div class="phone">
      <div class="phone-notch"></div>
      <button class="close-phone" onclick="closeFeed()">✕</button>

      <div class="phone-content">
        <div class="feed-card">
          <div class="feed-emoji">${card.emoji}</div>
          <div class="feed-text">${card.text}</div>
          <div class="feed-btns">${buttons}</div>
          <div class="feed-hint" style="margin-top:1rem">${hint}</div>
        </div>
        ${cryptoPanel}
      </div>
    </div>
  `;
}

function renderNav() {
  const active = (s) => state.screen === s ? "active" : "";
  const locked = state.screen === "business" ? "active" : "";

  return `
    <div class="nav">
      <button class="nav-item ${active("home")}" onclick="navigate('home')">
        <div class="nav-icon">🏠</div>HOME
      </button>
      <button class="nav-item ${active("feed")}" onclick="navigate('feed')">
        <div class="nav-icon">📱</div>ЛЕНТА
      </button>
      <button class="nav-item ${active("status")}" onclick="navigate('status')">
        <div class="nav-icon">📊</div>СТАТУС
      </button>
      <button class="nav-item ${locked}" onclick="navigate('business')">
        <div class="nav-icon">🏢</div>БИЗНЕС
      </button>
    </div>
  `;
}

/** ============================
 *  INIT + TICK
 *  ============================ */
window.onload = () => {
  loadState();
  ensureDailyReset();
  render();

  // Плавный таймер нужд — но НЕ трогаем ленту/карточки
  setInterval(() => {
    if (state.screen === "onboarding") return;
    const now = Date.now();
    const deltaSec = (now - state.lastUpdate) / 1000;
    state.lastUpdate = now;

    tickNeeds(deltaSec);
    saveState();

    // Перерисовываем только HOME/STATUS, чтобы не дёргать overlay
    if (!state.showPhone && !state.showCoursePicker) render();
  }, 5000);
};
</script>
</body>
</html>
