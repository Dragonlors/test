<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WATAFA GAME</title>

  <!-- Adsgram (Telegram Mini Apps) -->
  <script src="https://adsgram.ai/assets/js/adsgram.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#0a0a0a; color:#fff; overflow-x:hidden;
    }
    #app{ max-width:420px; margin:0 auto; min-height:100vh; background:#161616; position:relative; }

    /* Debug panel */
    .debug-panel{
      position:fixed; bottom:80px; left:10px; right:10px; max-width:400px;
      background:rgba(0,0,0,0.95); border:2px solid #ff4444;
      padding:1rem; border-radius:12px; z-index:3000;
      font-size:0.75rem; max-height:200px; overflow-y:auto;
    }
    .debug-title{ font-weight:900; color:#ff4444; margin-bottom:0.5rem; }
    .debug-line{ margin:0.3rem 0; color:#aaa; }
    .debug-ok{ color:#00ff88; }
    .debug-err{ color:#ff4444; }

    /* ===== Onboarding ===== */
    .onboarding{
      position:fixed; inset:0; background:#000; z-index:1000;
      display:flex; align-items:center; justify-content:center; flex-direction:column;
      padding:2rem; text-align:center;
    }
    .onboarding-text{ font-size:1.25rem; margin-bottom:2rem; animation:fadeIn .6s ease-out; }
    .notification-box{ width:100%; max-width:320px; }
    .notification{
      background:#1f1f1f; padding:1rem 1.2rem; border-radius:12px; margin:.5rem 0;
      border-left:3px solid #ff4444; animation:slideUp .45s ease-out forwards; opacity:0;
    }
    .notification:nth-child(1){ animation-delay:.1s; }
    .notification:nth-child(2){ animation-delay:.35s; }
    .notification:nth-child(3){ animation-delay:.6s; }
    .notification:nth-child(4){ animation-delay:.85s; }
    .notif-title{ font-size:.85rem; color:#888; margin-bottom:.25rem; }
    .notif-text{ font-size:1.05rem; font-weight:800; }
    .start-btn{
      margin-top:1.5rem; padding:1.1rem 2.6rem; background:#00ff88; color:#000;
      border:none; border-radius:12px; font-size:1.05rem; font-weight:800; cursor:pointer;
      animation:slideUp .45s ease-out 1.1s forwards; opacity:0;
    }
    .start-btn:active{ transform:scale(.96); }

    /* ===== Top hint (optional) ===== */
    .top-hint{
      position:fixed; top:0; left:0; right:0; z-index:300;
      background:linear-gradient(135deg,#00ff88 0%,#00cc6a 100%); color:#000;
      padding:1rem; text-align:center; font-weight:900; font-size:.95rem;
      animation:slideDown .4s ease-out;
    }
    @keyframes slideDown{ from{ transform:translateY(-100%);} to{transform:translateY(0);} }

    /* ===== Top status bar: ONLY hunger/charge/level (as requested) ===== */
    .top-status{
      position:fixed; top:1rem; right:1rem; z-index:200;
      background:rgba(31,31,31,.95); backdrop-filter:blur(10px);
      padding:.6rem 1rem; border-radius:20px;
      display:flex; align-items:center; gap:.75rem;
      border:1px solid rgba(255,255,255,.08);
      cursor:pointer; transition:.2s;
    }
    .top-status:hover{ border-color:#00ff88; }
    .status-item{ display:flex; align-items:center; gap:.3rem; font-size:.8rem; font-weight:700; color:#eee; }
    .status-icon{ font-size:.95rem; }

    /* ===== Scene ===== */
    .scene{
      min-height:100vh;
      background-image:url('https://dragonlors.github.io/test/image/fon1.png');
      background-size:cover; background-position:center;
      display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden; padding:2rem;
    }
    .scene::before{
      content:""; position:absolute; inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.65) 100%);
      z-index:1;
    }
    .scene-content{ text-align:center; z-index:2; max-width:330px; position:relative; }
    .scene-title{ font-size:2.1rem; font-weight:900; margin-bottom:1rem; text-shadow:0 2px 20px rgba(0,0,0,.8); }
    .scene-desc{ font-size:1.03rem; color:#fff; line-height:1.6; margin-bottom:1.2rem; text-shadow:0 1px 10px rgba(0,0,0,.8); }
    .scene-hint{
      padding:1rem; background:rgba(0,0,0,.5); backdrop-filter:blur(10px);
      border-radius:12px; font-size:.95rem; font-style:italic; color:#ddd;
      border:1px solid rgba(255,255,255,.1);
    }

    /* ===== Main action button ===== */
    .action-area{
      position:absolute; bottom:100px; left:0; right:0; padding:0 1.5rem; z-index:2;
    }
    .main-btn{
      width:100%; padding:1.15rem;
      background:#00ff88; color:#000; border:none; border-radius:12px;
      font-size:1.05rem; font-weight:900; cursor:pointer;
      box-shadow:0 4px 20px rgba(0,255,136,.35);
    }
    .main-btn:active{ transform:scale(.98); }
    .main-btn:disabled{ background:#333; color:#666; cursor:not-allowed; box-shadow:none; }

    /* ===== Phone overlay (Feed + Skills tabs inside) ===== */
    .phone-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.95);
      z-index:2000; display:flex; align-items:center; justify-content:center;
      animation:fadeIn .25s ease-out;
    }
    .phone{
      width:360px; height:720px; background:#000;
      border-radius:40px; border:8px solid #1a1a1a;
      position:relative; overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.85);
    }
    .phone-notch{
      position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:120px; height:28px; background:#000; border-radius:0 0 20px 20px; z-index:10;
    }
    .close-phone{
      position:absolute; top:50px; right:1rem; z-index:11;
      width:40px; height:40px; border:none; border-radius:20px;
      background:rgba(255,255,255,.1); backdrop-filter:blur(10px);
      color:#fff; font-size:1.4rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }

    .phone-tabs{
      position:absolute; top:40px; left:0; right:0; z-index:11;
      padding:0 1rem;
      display:flex; gap:.6rem;
    }
    .tab-btn{
      flex:1;
      padding:.7rem .8rem;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(31,31,31,.85);
      color:#cfcfcf;
      font-weight:900;
      cursor:pointer;
      transition:.2s;
      text-align:center;
      user-select:none;
      font-size:.85rem;
    }
    .tab-btn.active{
      background:rgba(0,255,136,.18);
      border-color:rgba(0,255,136,.6);
      color:#00ff88;
    }

    .phone-content{
      height:100%;
      overflow-y:auto;
      padding:90px 1rem 1rem;
      scroll-behavior:smooth;
    }
    .phone-content::-webkit-scrollbar{ display:none; }

    .feed-card{
      background:#161616; border-radius:16px; padding:1.4rem;
      margin-bottom:1rem; border:1px solid #2a2a2a; animation:slideUp .25s ease-out;
    }
    .feed-emoji{ font-size:3rem; text-align:center; margin-bottom:1rem; }
    .feed-text{ font-size:1rem; text-align:center; margin-bottom:1.2rem; line-height:1.5; color:#ddd; }
    .feed-btns{ display:flex; gap:.5rem; }
    .feed-btn{
      flex:1; padding:.8rem; border:2px solid #333; background:transparent; color:#fff;
      border-radius:8px; font-weight:800; cursor:pointer; transition:.2s; font-size:.85rem;
    }
    .feed-btn:hover{ background:#222; border-color:#00ff88; }
    .feed-btn.trigger{ background:#00ff88; color:#000; border-color:#00ff88; }

    .feed-hint{ text-align:center; color:#777; font-size:.9rem; margin:1rem 0; font-style:italic; }

    /* ===== Skills screen inside phone ===== */
    .skill-card{
      background:#161616; border-radius:16px; padding:1.3rem;
      margin-bottom:1rem; border:1px solid #2a2a2a;
    }
    .skill-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .skill-left{ display:flex; align-items:center; gap:.8rem; }
    .skill-emoji{ font-size:2rem; }
    .skill-name{ font-size:1.05rem; font-weight:900; }
    .skill-sub{ font-size:.85rem; color:#888; margin-top:.15rem; }
    .skill-btn{
      padding:.75rem 1rem; border-radius:12px; border:1px solid rgba(255,255,255,.12);
      background:rgba(31,31,31,.85); color:#fff; font-weight:900; cursor:pointer;
      transition:.2s;
    }
    .skill-btn.primary{ background:#00ff88; color:#000; border-color:#00ff88; }
    .skill-btn:active{ transform:scale(.98); }

    .progress{ width:100%; height:8px; background:#333; border-radius:4px; overflow:hidden; margin:.9rem 0 0; }
    .progress-fill{ height:100%; background:#00ff88; transition:width .35s; border-radius:4px; }

    .train-btn{
      width:100%; padding:1.2rem; border:none; border-radius:14px;
      background:linear-gradient(135deg,#00ff88 0%,#00cc6a 100%);
      color:#000; font-weight:950; font-size:1.05rem; cursor:pointer;
      box-shadow:0 4px 20px rgba(0,255,136,.25);
      margin-top:.8rem;
    }
    .train-btn:disabled{ background:#333; color:#666; cursor:not-allowed; box-shadow:none; }

    .tiny-note{ text-align:center; color:#8a8a8a; font-size:.85rem; margin-top:.8rem; }

    /* ===== Screens (Status / Business placeholder) ===== */
    .content-screen{ padding:1.5rem; padding-bottom:100px; padding-top:5rem; min-height:100vh; }
    .screen-title{ font-size:1.7rem; font-weight:950; margin-bottom:1.2rem; }

    .card{
      background:#1f1f1f; border-radius:16px; padding:1.2rem;
      margin-bottom:1rem; border:1px solid #2a2a2a;
    }
    .card-header{ font-size:.8rem; color:#888; text-transform:uppercase; letter-spacing:1px; margin-bottom:.6rem; font-weight:800; }
    .card-value{ font-size:1.2rem; font-weight:900; margin-bottom:.3rem; }
    .card-desc{ font-size:.9rem; color:#9a9a9a; line-height:1.5; }

    .ad-reward-wrap{
      display:grid; grid-template-columns:1fr 1fr; gap:.8rem;
      margin-top:.7rem;
    }
    .ad-btn{
      padding:1rem; border-radius:14px; border:1px solid rgba(255,255,255,.12);
      background:rgba(31,31,31,.9); color:#fff; font-weight:950; cursor:pointer; transition:.2s;
      display:flex; align-items:center; justify-content:center; gap:.5rem;
    }
    .ad-btn:hover{ border-color:rgba(0,255,136,.6); background:rgba(0,255,136,.08); }
    .ad-btn:disabled{ opacity:0.5; cursor:not-allowed; }
    .ad-left{ color:#7d7d7d; font-size:.9rem; text-align:center; margin-top:.6rem; }

    /* ===== Bottom nav ===== */
    .nav{
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      max-width:420px; width:100%;
      background:#1f1f1f; border-top:1px solid #2a2a2a;
      display:flex; z-index:100;
    }
    .nav-item{
      flex:1; display:flex; flex-direction:column; align-items:center; gap:.25rem;
      padding:.75rem .4rem; border:none; background:transparent;
      color:#666; cursor:pointer; font-size:.7rem; font-weight:900; transition:.2s;
    }
    .nav-item.active{ color:#00ff88; }
    .nav-icon{ font-size:1.35rem; }

    /* Animations */
    @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
    @keyframes slideUp{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
    @keyframes slideDown{ from{transform:translateY(-100%);} to{transform:translateY(0);} }
    .hidden{ display:none !important; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    // =========================
    // DEBUG MODE
    // =========================
    const DEBUG = true; // Включить режим отладки
    const debugLog = [];
    
    function log(msg, type = "info") {
      const timestamp = new Date().toLocaleTimeString();
      debugLog.push({ time: timestamp, msg, type });
      console.log(`[${timestamp}] ${msg}`);
      if (debugLog.length > 20) debugLog.shift();
    }

    // =========================
    // ENVIRONMENT CHECK
    // =========================
    function checkEnvironment() {
      const env = {
        isTelegram: false,
        hasWebApp: false,
        hasAdsgram: false,
        adsgramLoaded: false,
        userAgent: navigator.userAgent
      };

      // Check Telegram WebApp
      if (window.Telegram && window.Telegram.WebApp) {
        env.isTelegram = true;
        env.hasWebApp = true;
        log("✓ Telegram WebApp обнаружен", "ok");
      } else {
        log("✗ Telegram WebApp НЕ обнаружен", "err");
      }

      // Check Adsgram
      if (window.Adsgram) {
        env.hasAdsgram = true;
        if (typeof window.Adsgram.init === "function") {
          env.adsgramLoaded = true;
          log("✓ Adsgram загружен и готов", "ok");
        } else {
          log("✗ Adsgram есть, но init не функция", "err");
        }
      } else {
        log("✗ Adsgram НЕ загружен", "err");
      }

      return env;
    }

    // =========================
    // STATE
    // =========================
    const DEFAULT_STATE = {
      step: 0,
      screen: "onboarding",
      hunger: 70,
      charge: 55,
      level: 1,
      money: 0,
      day: 1,
      degradation: 0,
      home: "none",
      showPhone: false,
      phoneTab: "feed",
      feedClicks: 0,
      currentFeedCard: null,
      currentFeedSeed: 0,
      firstCourseOffered: false,
      selectedCourse: null,
      skills: {
        tech:     { level: 0, xp: 0, unlocked: false },
        music:    { level: 0, xp: 0, unlocked: false },
        sport:    { level: 0, xp: 0, unlocked: false },
        politics: { level: 0, xp: 0, unlocked: false }
      },
      ads: {
        date: null,
        foodLeft: 3,
        chargeLeft: 3
      },
      lastUpdate: Date.now(),
      showFirstHint: false,
      showDebug: DEBUG
    };

    const state = structuredClone(DEFAULT_STATE);

    // =========================
    // CONTENT
    // =========================
    const scenes = {
      none: {
        title: "Улица",
        desc: "Ты сидишь на картонке возле зарядки. Телефон — твой единственный инструмент.",
        hint: "Найди в ленте шанс, чтобы выбрать путь."
      },
      basement: {
        title: "Подвал",
        desc: "Сырой подвал и лампа. Но это уже твой угол.",
        hint: "Тут проще сосредоточиться."
      }
    };

    const feedData = {
      trash: [
        { text: "15 лайфхаков как стать миллионером за неделю", emoji: "💸" },
        { text: "Топ-10 мемов, от которых тупеют пальцы", emoji: "🤡" },
        { text: "Этот трюк шокирует даже врачей!", emoji: "😱" },
        { text: "Купи курс у эксперта с 2 месяцами опыта", emoji: "🎯" },
        { text: "Залипательное видео: краска сохнет", emoji: "🎨" },
        { text: "Гороскоп: тебя ждёт удача... может быть", emoji: "🔮" }
      ],
      neutral: [
        { text: "Рецепт простой еды на выживание", emoji: "🍜" },
        { text: "Красивый закат над городом", emoji: "🌇" },
        { text: "Интересные факты о космосе", emoji: "🌌" },
        { text: "Короткий ролик про дисциплину", emoji: "🧠" },
        { text: "Смешная реклама нового телефона", emoji: "📱" }
      ],
      triggers: [
        { text: "Бесплатный курс: веб-разработка", emoji: "💻", branch: "tech" },
        { text: "Открытая тренировка рядом", emoji: "🏋️", branch: "sport" },
        { text: "Музыкальный баттл сегодня", emoji: "🎵", branch: "music" },
        { text: "Нужны помощники на митинг", emoji: "🏛️", branch: "politics" }
      ]
    };

    const courses = [
      { key:"tech",     emoji:"💻", name:"Основы технологий" },
      { key:"music",    emoji:"🎵", name:"Основы музыки" },
      { key:"sport",    emoji:"🏋️", name:"Основы спорта" },
      { key:"politics", emoji:"🏛️", name:"Основы политики" }
    ];

    // =========================
    // SAVE/LOAD
    // =========================
    function save() {
      localStorage.setItem("watafa_game", JSON.stringify(state));
    }
    function load() {
      const raw = localStorage.getItem("watafa_game");
      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);
        Object.assign(state, parsed);
        if (!state.ads) state.ads = structuredClone(DEFAULT_STATE.ads);
        if (!state.skills) state.skills = structuredClone(DEFAULT_STATE.skills);
        state.lastUpdate = Date.now();
        log("Сохранение загружено");
      } catch(e) {
        log("Ошибка загрузки: " + e.message, "err");
      }
    }

    // =========================
    // HELPERS
    // =========================
    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    function getSkillName(key){
      return ({ tech:"Технологии", music:"Музыка", sport:"Спорт", politics:"Политика" })[key] || key;
    }

    function resetDailyAdsIfNeeded(){
      const today = new Date().toDateString();
      if (state.ads.date !== today) {
        state.ads.date = today;
        state.ads.foodLeft = 3;
        state.ads.chargeLeft = 3;
        log("Сброс дневных лимитов рекламы");
      }
    }

    // =========================
    // TIME / REGEN
    // =========================
    function updateTime(){
      const now = Date.now();
      const dt = (now - state.lastUpdate) / 1000;
      state.lastUpdate = now;

      state.hunger = clamp(state.hunger + dt * 0.12, 0, 100);
      state.charge = clamp(state.charge - dt * 0.03, 0, 100);
      state.degradation = clamp(state.degradation - dt * 0.02, 0, 100);

      resetDailyAdsIfNeeded();
    }

    // =========================
    // FEED
    // =========================
    function generateFeedCard(){
      if (state.feedClicks === 4 && !state.firstCourseOffered) {
        return { type:"first-course", text:"Бесплатный курс по...", emoji:"🎓" };
      }

      const rand = Math.random() * 100;
      const trashBoost = state.degradation * 0.35;
      const triggerBoost = Math.max(0, 18 - state.degradation * 0.15);

      if (rand < 45 + trashBoost) {
        const it = feedData.trash[Math.floor(Math.random() * feedData.trash.length)];
        return { ...it, type:"trash" };
      } else if (rand < 75 + trashBoost) {
        const it = feedData.neutral[Math.floor(Math.random() * feedData.neutral.length)];
        return { ...it, type:"neutral" };
      } else if (rand < 92 + trashBoost - triggerBoost) {
        const it = feedData.triggers[Math.floor(Math.random() * feedData.triggers.length)];
        return { ...it, type:"trigger" };
      } else {
        const it = feedData.neutral[Math.floor(Math.random() * feedData.neutral.length)];
        return { ...it, type:"neutral" };
      }
    }

    function ensureFeedCard(){
      if (!state.currentFeedCard) {
        state.currentFeedCard = generateFeedCard();
      }
    }

    function nextFeedCard(){
      state.currentFeedSeed++;
      state.currentFeedCard = generateFeedCard();
    }

    // =========================
    // GAME FLOW
    // =========================
    function startGame(){
      Object.assign(state, structuredClone(DEFAULT_STATE));
      state.screen = "home";
      state.showFirstHint = true;
      state.currentFeedCard = null;
      state.showDebug = DEBUG;

      log("Игра начата");

      setTimeout(() => {
        state.showFirstHint = false;
        render();
      }, 4500);

      render();
    }

    function navigate(screen){
      state.screen = screen;
      state.showPhone = false;
      log("Переход на экран: " + screen);
      render();
    }

    function openPhone(){
      if (state.charge < 3) {
        log("Недостаточно заряда для открытия телефона", "err");
        return;
      }
      state.showPhone = true;
      state.phoneTab = "feed";
      ensureFeedCard();
      log("Телефон открыт");
      render();
    }
    
    function closePhone(){
      state.showPhone = false;
      log("Телефон закрыт");
      render();
    }
    
    function switchPhoneTab(tab){
      state.phoneTab = tab;
      if (tab === "feed") ensureFeedCard();
      log("Переключение таба: " + tab);
      render();
    }

    function unlockBranch(branch){
      if (!branch) return;
      if (!state.skills[branch]) return;
      if (!state.skills[branch].unlocked) {
        state.skills[branch].unlocked = true;
        if (!state.selectedCourse) state.selectedCourse = branch;
        log("Открыт навык: " + getSkillName(branch), "ok");
        alert(`🎯 Открыт путь: ${getSkillName(branch)}!`);
      }
    }

    function offerFirstCourse(){
      const names = courses.map(c => `${c.emoji} ${c.name}`).join("\n");
      const pick = prompt(
        "Бесплатный курс!\nВыбери направление:\n\n" + names + "\n\nНапиши: tech / music / sport / politics",
        "tech"
      );
      const key = (pick || "").trim().toLowerCase();
      if (state.skills[key]) {
        state.firstCourseOffered = true;
        state.selectedCourse = key;
        unlockBranch(key);
        state.phoneTab = "skills";
        log("Выбран первый курс: " + key, "ok");
      } else {
        alert("Не понял выбор. Напиши: tech / music / sport / politics");
      }
    }

    function feedAction(action){
      updateTime();
      state.feedClicks++;
      state.charge = clamp(state.charge - 1.8, 0, 100);
      state.degradation = clamp(state.degradation + 2.5, 0, 100);

      const card = state.currentFeedCard;

      if (card?.type === "first-course") {
        offerFirstCourse();
        nextFeedCard();
        render();
        return;
      }

      if (card?.type === "trigger" && card.branch) {
        unlockBranch(card.branch);
      }

      log("Действие в ленте: " + action);
      nextFeedCard();
      render();
    }

    function trainSkill(key){
      if (!state.skills[key]?.unlocked) return;

      if (state.hunger <= 0) {
        alert("🍔 Ты на нуле. Отдохни — со временем голод восстановится.");
        return;
      }

      updateTime();

      state.hunger = clamp(state.hunger - 1.2, 0, 100);
      state.charge = clamp(state.charge - 0.6, 0, 100);

      const degrPenalty = state.degradation / 120;
      const eff = clamp(1 - degrPenalty, 0.25, 1.0);
      const xp = Math.floor((2 + Math.random()*3) * eff);
      const s = state.skills[key];
      s.xp += xp;

      const needed = 100 + s.level * 120;
      if (s.xp >= needed) {
        s.xp -= needed;
        s.level += 1;
        state.level += 1;
        state.money += 1 + Math.floor(s.level / 2);
        log(`${getSkillName(key)}: уровень ${s.level}!`, "ok");
        alert(`🎉 ${getSkillName(key)}: уровень ${s.level}! (+уровень жизни, +$)`);
      }

      render();
    }

    // =========================
    // ADSGRAM с FALLBACK
    // =========================
    function showAdReward(type){
      resetDailyAdsIfNeeded();

      if (type === "charge" && state.ads.chargeLeft <= 0) { 
        alert("⚡ На сегодня лимит исчерпан."); 
        return; 
      }
      if (type === "food" && state.ads.foodLeft <= 0) { 
        alert("🍔 На сегодня лимит исчерпан."); 
        return; 
      }

      const env = checkEnvironment();

      // РЕЖИМ РАЗРАБОТКИ: если нет Telegram, даём награду сразу
      if (!env.isTelegram && DEBUG) {
        log("DEV MODE: награда без рекламы", "ok");
        if (type === "charge") {
          state.charge = clamp(state.charge + 35, 0, 100);
          state.ads.chargeLeft -= 1;
          alert("⚡ [DEV] Заряд восстановлен!");
        } else {
          state.hunger = clamp(state.hunger + 35, 0, 100);
          state.ads.foodLeft -= 1;
          alert("🍔 [DEV] Голод восстановлен!");
        }
        render();
        return;
      }

      // PRODUCTION: проверяем Adsgram
      if (!env.adsgramLoaded) {
        log("Adsgram не загружен", "err");
        alert("Adsgram не загрузился. Проверь, что это запускается внутри Telegram и скрипт доступен.");
        return;
      }

      try {
        log("Инициализация Adsgram...");
        const AdController = window.Adsgram.init({ blockId: "21029" });

        AdController.show().then(() => {
          log("Реклама просмотрена успешно", "ok");
          if (type === "charge") {
            state.charge = clamp(state.charge + 35, 0, 100);
            state.ads.chargeLeft -= 1;
            alert("⚡ Спасибо! Заряд восстановлен.");
          } else {
            state.hunger = clamp(state.hunger + 35, 0, 100);
            state.ads.foodLeft -= 1;
            alert("🍔 Спасибо! Голод восстановлен.");
          }
          render();
        }).catch((result) => {
          log("Реклама пропущена/ошибка: " + JSON.stringify(result), "err");
        });
      } catch (e) {
        log("Ошибка Adsgram: " + e.message, "err");
        alert("Ошибка при попытке показать рекламу. Проверь консоль.");
      }
    }

    // =========================
    // RENDER
    // =========================
    function renderDebug(){
      if (!state.showDebug) return "";
      
      const env = checkEnvironment();
      
      return `
        <div class="debug-panel">
          <div class="debug-title">🔧 DEBUG PANEL</div>
          <div class="debug-line ${env.isTelegram ? 'debug-ok' : 'debug-err'}">
            Telegram: ${env.isTelegram ? "✓ ДА" : "✗ НЕТ"}
          </div>
          <div class="debug-line ${env.adsgramLoaded ? 'debug-ok' : 'debug-err'}">
            Adsgram: ${env.adsgramLoaded ? "✓ ГОТОВ" : "✗ НЕ ЗАГРУЖЕН"}
          </div>
          <div class="debug-line">
            UserAgent: ${env.userAgent.slice(0, 40)}...
          </div>
          <div class="debug-line">
            Последние логи:
          </div>
          ${debugLog.slice(-5).map(l => 
            `<div class="debug-line ${l.type === 'ok' ? 'debug-ok' : l.type === 'err' ? 'debug-err' : ''}">${l.time} ${l.msg}</div>`
          ).join("")}
          <button onclick="state.showDebug=false; render();" style="margin-top:0.5rem; padding:0.5rem; background:#ff4444; border:none; color:#fff; border-radius:6px; cursor:pointer;">
            Закрыть
          </button>
        </div>
      `;
    }

    function renderTopStatus(){
      return `
        <div class="top-status" onclick="navigate('status')">
          <div class="status-item"><span class="status-icon">🍔</span><span>${Math.floor(state.hunger)}%</span></div>
          <div class="status-item"><span class="status-icon">🔋</span><span>${Math.floor(state.charge)}%</span></div>
          <div class="status-item"><span class="status-icon">⭐</span><span>${state.level}</span></div>
        </div>
      `;
    }

    function renderNav(){
      return `
        <div class="nav">
          <button class="nav-item ${state.screen==='home'?'active':''}" onclick="navigate('home')">
            <div class="nav-icon">🏠</div>HOME
          </button>
          <button class="nav-item ${state.screen==='feed'?'active':''}" onclick="navigate('feed')">
            <div class="nav-icon">📱</div>ЛЕНТА
          </button>
          <button class="nav-item ${state.screen==='status'?'active':''}" onclick="navigate('status')">
            <div class="nav-icon">📊</div>СТАТУС
          </button>
          <button class="nav-item ${state.screen==='business'?'active':''}" onclick="navigate('business')">
            <div class="nav-icon">🏢</div>БИЗНЕС
          </button>
        </div>
      `;
    }

    function renderPhone(){
      ensureFeedCard();

      if (state.phoneTab === "feed") {
        const card = state.currentFeedCard;

        let buttons = "";
        if (card.type === "first-course") {
          buttons = `<button class="feed-btn trigger" onclick="feedAction('open')">ВЫБРАТЬ КУРС</button>`;
        } else if (card.type === "trigger") {
          buttons = `<button class="feed-btn trigger" onclick="feedAction('open')">ОТКРЫТЬ</button>`;
        } else if (state.degradation < 30) {
          buttons = `
            <button class="feed-btn" onclick="feedAction('ok')">ПРИКОЛЬНО</button>
            <button class="feed-btn" onclick="feedAction('ok')">ЯСНО</button>
            <button class="feed-btn" onclick="feedAction('ok')">ПОНЯТНО</button>
          `;
        } else if (state.degradation < 60) {
          buttons = `
            <button class="feed-btn" onclick="feedAction('ok')">ПРИКОЛЬНО</button>
            <button class="feed-btn" onclick="feedAction('deg')">ФА</button>
            <button class="feed-btn" onclick="feedAction('deg')">ПЭПЭ</button>
          `;
        } else {
          buttons = `
            <button class="feed-btn" onclick="feedAction('deg')">ФА</button>
            <button class="feed-btn" onclick="feedAction('deg')">ПЭПЭ</button>
            <button class="feed-btn" onclick="feedAction('deg')">ШНЕЛЯ</button>
          `;
        }

        return `
          <div class="phone">
            <div class="phone-notch"></div>
            <div class="phone-tabs">
              <div class="tab-btn ${state.phoneTab==='feed'?'active':''}" onclick="switchPhoneTab('feed')">Лента</div>
              <div class="tab-btn ${state.phoneTab==='skills'?'active':''}" onclick="switchPhoneTab('skills')">Навыки</div>
            </div>
            <button class="close-phone" onclick="closePhone()">✕</button>
            <div class="phone-content">
              <div class="feed-card">
                <div class="feed-emoji">${card.emoji}</div>
                <div class="feed-text">${card.text}</div>
                <div class="feed-btns">${buttons}</div>
              </div>
              <div class="feed-hint">
                ${state.degradation > 65 ? "Голова гудит..." :
                  state.degradation > 35 ? "Ты листаешь снова." :
                  state.charge < 20 ? "Экран тускнеет." : "Время идёт."}
              </div>
              <div class="tiny-note">
                Клик по кнопке = «скролл». Карточка меняется только после твоего действия.
              </div>
            </div>
          </div>
        `;
      }

      const unlocked = Object.entries(state.skills).filter(([_, s]) => s.unlocked);
      const icons = { tech:"💻", music:"🎵", sport:"🏋️", politics:"🏛️" };

      return `
        <div class="phone">
          <div class="phone-notch"></div>
          <div class="phone-tabs">
            <div class="tab-btn ${state.phoneTab==='feed'?'active':''}" onclick="switchPhoneTab('feed')">Лента</div>
            <div class="tab-btn ${state.phoneTab==='skills'?'active':''}" onclick="switchPhoneTab('skills')">Навыки</div>
          </div>
          <button class="close-phone" onclick="closePhone()">✕</button>
          <div class="phone-content">
            ${unlocked.length ? unlocked.map(([key, s]) => {
              const needed = 100 + s.level * 120;
              const pct = needed > 0 ? clamp((s.xp / needed) * 100, 0, 100) : 0;
              const canTrain = state.hunger > 0 && state.charge > 0;
              return `
                <div class="skill-card">
                  <div class="skill-row">
                    <div class="skill-left">
                      <div class="skill-emoji">${icons[key]}</div>
                      <div>
                        <div class="skill-name">${getSkillName(key)}</div>
                        <div class="skill-sub">Ур. ${s.level} • XP ${Math.floor(s.xp)} / ${needed}</div>
                      </div>
                    </div>
                    <button class="skill-btn ${state.selectedCourse===key?'primary':''}" onclick="state.selectedCourse='${key}'; render();">
                      ${state.selectedCourse===key ? "Выбран" : "Выбрать"}
                    </button>
                  </div>
                  <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
                  <button class="train-btn" ${canTrain ? "" : "disabled"} onclick="trainSkill('${key}')">
                    ${canTrain ? "Прокачать (клик)" : "Нужен голод/заряд"}
                  </button>
                  <div class="tiny-note">
                    Прокачка тратит голод и заряд. Голод восстанавливается со временем.
                  </div>
                </div>
              `;
            }).join("") : `
              <div class="feed-card">
                <div class="feed-emoji">🔒</div>
                <div class="feed-text">Навыки закрыты. Найди бесплатный курс в ленте.</div>
                <div class="feed-btns">
                  <button class="feed-btn trigger" onclick="switchPhoneTab('feed')">В ЛЕНТУ</button>
                </div>
              </div>
            `}
            <div class="tiny-note">
              Подсказка: чем больше деградации, тем хуже эффективность прокачки.
            </div>
          </div>
        </div>
      `;
    }

    function render(){
      updateTime();
      save();

      const app = document.getElementById("app");

      if (state.screen === "onboarding") {
        if (state.step === 0) {
          app.innerHTML = `<div class="onboarding"><div class="onboarding-text">Ты решил заняться трейдингом…</div></div>`;
          setTimeout(()=>{ state.step=1; render(); }, 1500);
        } else if (state.step === 1) {
          app.innerHTML = `
            <div class="onboarding">
              <div class="notification-box">
                <div class="notification"><div class="notif-title">Биржа</div><div class="notif-text">Маржин-колл</div></div>
                <div class="notification"><div class="notif-title">Биржа</div><div class="notif-text">Ликвидация</div></div>
                <div class="notification"><div class="notif-title">Telegram</div><div class="notif-text">Бро, ты жив?</div></div>
                <div class="notification"><div class="notif-title">Баланс</div><div class="notif-text">0.00</div></div>
              </div>
            </div>
          `;
          setTimeout(()=>{ state.step=2; render(); }, 2400);
        } else if (state.step === 2) {
          app.innerHTML = `<div class="onboarding"><div class="onboarding-text">…и рынок решил иначе.</div></div>`;
          setTimeout(()=>{ state.step=3; render(); }, 1500);
        } else {
          app.innerHTML = `
            <div class="onboarding">
              <div style="font-size:6rem; margin-bottom:1.4rem;">📦</div>
              <div class="onboarding-text">Добро пожаловать обратно в реальность.</div>
              <div style="font-size:.92rem; color:#666; margin-top:.6rem;">Зато опыт есть. 😄</div>
              <button class="start-btn" onclick="startGame()">Начать заново</button>
            </div>
          `;
        }
        return;
      }

      if (state.screen === "home") {
        const scene = scenes[state.home] || scenes.none;
        const canOpen = state.charge > 3;

        app.innerHTML = `
          ${state.showFirstHint ? `<div class="top-hint">📱 Открой ленту — там появляются шансы</div>` : ""}
          ${renderTopStatus()}
          ${renderDebug()}
          <div class="scene">
            <div class="scene-content">
              <div class="scene-title">${scene.title}</div>
              <div class="scene-desc">${scene.desc}</div>
              <div class="scene-hint">
                ${state.charge < 15 ? "⚡ Экран тускнеет." :
                  state.hunger < 15 ? "🍔 Слабость… отдохни." :
                  state.degradation > 60 ? "🤯 Мозг в кашу." :
                  scene.hint}
              </div>
            </div>
          </div>
          <div class="action-area">
            <button class="main-btn" ${!canOpen ? "disabled" : ""} onclick="openPhone()">
              ${canOpen ? "ОТКРЫТЬ ЛЕНТУ" : "Недостаточно заряда"}
            </button>
          </div>
          ${renderNav()}
        `;
      }

      if (state.screen === "feed") {
        app.innerHTML = `
          ${renderTopStatus()}
          ${renderDebug()}
          <div class="content-screen">
            <div class="screen-title">Лента</div>
            <div class="card">
              <div class="card-header">СМЫСЛ</div>
              <div class="card-value">Жизнь начинается из ленты.</div>
              <div class="card-desc">Тут появляются курсы, триггеры и «деградация».</div>
              <div style="margin-top:1rem;">
                <button class="main-btn" onclick="openPhone()">ОТКРЫТЬ</button>
              </div>
            </div>
          </div>
          ${renderNav()}
        `;
      }

      if (state.screen === "status") {
        const unlocked = Object.entries(state.skills).filter(([_, s]) => s.unlocked);
        const role =
          state.level < 5  ? "Уличный новичок" :
          state.level < 15 ? "Начинающий" :
          state.level < 30 ? "Опытный" : "Икона";

        const env = checkEnvironment();

        app.innerHTML = `
          ${renderTopStatus()}
          ${renderDebug()}
          <div class="content-screen">
            <div class="screen-title">Статус</div>
            <div class="card">
              <div class="card-header">КТО ТЫ</div>
              <div class="card-value">${role}</div>
              <div class="card-desc">
                ${state.home === "none"
                  ? "Без дома. Но ты держишься."
                  : "У тебя есть крыша. Это многое меняет."}
              </div>
            </div>
            <div class="card">
              <div class="card-header">ФИНАНСЫ (НЕ НА HOME)</div>
              <div class="card-value">${state.money}$</div>
              <div class="card-desc">На главном экране деньги скрыты принципиально.</div>
            </div>
            <div class="card">
              <div class="card-header">НАВЫКИ</div>
              <div class="card-desc">
                ${unlocked.length
                  ? unlocked.map(([k,s]) => `• ${getSkillName(k)}: ур. ${s.level}`).join("<br>")
                  : "Пока нет. Открой курс в ленте."}
              </div>
            </div>
            <div class="card">
              <div class="card-header">РЕКЛАМА → НАГРАДА</div>
              <div class="card-desc">
                ${env.isTelegram 
                  ? "Смотри рекламу и получай заряд/еду." 
                  : "⚠️ Работает только в Telegram. Сейчас DEV режим - награды бесплатно."}
              </div>
              <div class="ad-reward-wrap">
                <button class="ad-btn" onclick="showAdReward('charge')" ${state.ads.chargeLeft<=0 ? 'disabled':''}>
                  ⚡ Заряд
                </button>
                <button class="ad-btn" onclick="showAdReward('food')" ${state.ads.foodLeft<=0 ? 'disabled':''}>
                  🍔 Еда
                </button>
              </div>
              <div class="ad-left">
                Осталось сегодня: ⚡ ${state.ads.chargeLeft} / 🍔 ${state.ads.foodLeft}
              </div>
            </div>
            ${DEBUG ? `
              <div class="card">
                <div class="card-header">ОТЛАДКА</div>
                <button onclick="state.showDebug=!state.showDebug; render();" style="padding:0.8rem; background:#ff4444; border:none; color:#fff; border-radius:8px; cursor:pointer; width:100%;">
                  ${state.showDebug ? "Скрыть Debug" : "Показать Debug"}
                </button>
              </div>
            ` : ""}
          </div>
          ${renderNav()}
        `;
      }

      if (state.screen === "business") {
        const locked = state.level < 10;
        app.innerHTML = `
          ${renderTopStatus()}
          ${renderDebug()}
          <div class="content-screen">
            <div class="screen-title">Бизнес</div>
            <div class="card">
              <div class="card-header">${locked ? "ЗАКРЫТО" : "ДОСТУПНО"}</div>
              <div class="card-value">${locked ? "Нужно вырасти" : "Добро пожаловать"}</div>
              <div class="card-desc">
                ${locked
                  ? "Бизнес откроется позже (например, с уровня 10). Дальше — бесконечная игра: еженедельно добавляется новый бизнес."
                  : "Тут будет пассивный доход, масштабирование и новые бизнесы каждую неделю."}
              </div>
            </div>
          </div>
          ${renderNav()}
        `;
      }

      if (state.showPhone) {
        const overlay = document.createElement("div");
        overlay.className = "phone-overlay";
        overlay.innerHTML = renderPhone();
        app.appendChild(overlay);
      }
    }

    // =========================
    // BOOT
    // =========================
    window.onload = () => {
      log("=== WATAFA GAME START ===");
      const env = checkEnvironment();
      
      load();
      resetDailyAdsIfNeeded();
      render();

      setInterval(() => {
        if (state.screen !== "onboarding" && !state.showPhone) {
          updateTime();
          save();
          render();
        }
      }, 5000);
    };
  </script>
</body>
</html>
