<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WATAFA GAME</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .stats {
            position: absolute;
            top: 20px;
            text-align: center;
        }

        .level {
            font-size: 20px;
            font-weight: bold;
        }

        .xp {
            font-size: 16px;
            opacity: 0.8;
        }

        .tap-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff0055, #ff8800);
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 100, 0.6);
            transition: transform 0.05s;
        }

        .tap-btn:active {
            transform: scale(0.95);
        }

        .word {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.4);
            }
        }
    </style>
</head>
<body>

<div class="stats">
    <div class="level">Уровень: <span id="level">1</span></div>
    <div class="xp">Клики: <span id="xp">0</span></div>
</div>

<button class="tap-btn" id="tapBtn">ТАПАЙ</button>

<script>
    let xp = 0;
    let level = 1;

    const xpEl = document.getElementById("xp");
    const levelEl = document.getElementById("level");
    const btn = document.getElementById("tapBtn");

    function getWordByLevel(level) {
        if (level === 1) return "ФА";
        if (level === 2) return "ШНЕЛЯ";
        if (level === 3) return "ВАТАФА";
        return "???";
    }

    function updateLevel() {
        if (xp >= 20) level = 3;
        else if (xp >= 10) level = 2;
        else level = 1;

        levelEl.textContent = level;
    }

    function showWord(word) {
        const el = document.createElement("div");
        el.className = "word";
        el.textContent = word;

        const x = window.innerWidth / 2 - 30 + (Math.random() * 60 - 30);
        const y = window.innerHeight / 2 - 30 + (Math.random() * 60 - 30);

        el.style.left = x + "px";
        el.style.top = y + "px";

        document.body.appendChild(el);

        setTimeout(() => {
            el.remove();
        }, 1000);
    }

    btn.addEventListener("click", () => {
        xp++;
        xpEl.textContent = xp;

        updateLevel();

        const word = getWordByLevel(level);
        showWord(word);

        // лёгкая тряска
        btn.style.transform = "scale(0.9)";
        setTimeout(() => {
            btn.style.transform = "scale(1)";
        }, 50);
    });
</script>

</body>
</html>
