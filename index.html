<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Социальный Лифт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }
        
        #app {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: #161616;
            position: relative;
        }
        
        /* Онбординг */
        .onboarding {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 2rem;
            text-align: center;
        }
        
        .onboarding-text {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out;
        }
        
        .notification-box {
            width: 100%;
            max-width: 300px;
        }
        
        .notification {
            background: #1f1f1f;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin: 0.5rem 0;
            border-left: 3px solid #ff4444;
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
        }
        
        .notification:nth-child(1) { animation-delay: 0.2s; }
        .notification:nth-child(2) { animation-delay: 0.5s; }
        .notification:nth-child(3) { animation-delay: 0.8s; }
        .notification:nth-child(4) { animation-delay: 1.1s; }
        
        .notif-title {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.3rem;
        }
        
        .notif-text {
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .start-btn {
            margin-top: 2rem;
            padding: 1.2rem 3rem;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            animation: slideUp 0.5s ease-out 1.5s forwards;
            opacity: 0;
        }
        
        .start-btn:active {
            transform: scale(0.95);
        }
        
        /* Верхний статус */
        .top-status {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(31, 31, 31, 0.95);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.2rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .top-status:hover {
            background: rgba(31, 31, 31, 1);
            border-color: #00ff88;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status-icon {
            font-size: 1rem;
        }

            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 2rem;
        }
        
        .scene::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }
        
        .scene-photo {

            inset: 0;
            background: url('data:image/svg+xml;charset=utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"%3E%3Cdefs%3E%3ClinearGradient id="a" x1="0" y1="0" x2="0" y2="1"%3E%3Cstop offset="0" stop-color="%23d4a574"/%3E%3Cstop offset="1" stop-color="%23aa7c4f"/%3E%3C/linearGradient%3E%3ClinearGradient id="b" x1="0" y1="0" x2="0" y2="1"%3E%3Cstop offset="0" stop-color="%23ffaa44"/%3E%3Cstop offset="1" stop-color="%23cc6622"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width="400" height="600" fill="%23111"/%3E%3Cellipse cx="100" cy="100" rx="30" ry="30" fill="url(%23b)" opacity="0.3"/%3E%3Cellipse cx="300" cy="150" rx="40" ry="40" fill="url(%23b)" opacity="0.2"/%3E%3Cpath d="M 50 400 Q 100 350 150 400 T 250 400" stroke="url(%23a)" fill="none" stroke-width="3" opacity="0.3"/%3E%3Crect x="20" y="450" width="360" height="2" fill="url(%23a)" opacity="0.2"/%3E%3Ccircle cx="200" cy="300" r="60" fill="%23333" opacity="0.5"/%3E%3Crect x="150" y="280" width="30" height="60" fill="%234a4a4a" rx="5"/%3E%3Crect x="220" y="280" width="30" height="60" fill="%234a4a4a" rx="5"/%3E%3Crect x="170" y="360" width="60" height="80" fill="%23555" rx="5"/%3E%3Crect x="340" y="520" width="40" height="60" fill="%23666" rx="3"/%3E%3Cpath d="M 330 550 L 340 520 L 360 540 Z" fill="%23888"/%3E%3Cellipse cx="250" cy="550" rx="80" ry="20" fill="%23222" opacity="0.5"/%3E%3Ctext x="200" y="570" font-family="Arial" font-size="12" fill="%23666" text-anchor="middle"%3E...%3C/text%3E%3C/svg%3E') center/cover;
            opacity: 0.6;
            z-index: 0;
        }
        
        .scene-content {
            text-align: center;
            z-index: 2;
            max-width: 320px;
            position: relative;
        }
        
        .scene-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
        }
        
        .scene-desc {
            font-size: 1.05rem;
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
        }
        
        .scene-hint {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            font-size: 0.95rem;
            font-style: italic;
            color: #999;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Кнопка действия */
        .action-area {
            position: absolute;
            bottom: 100px;
            left: 0;
            right: 0;
            padding: 0 1.5rem;
            z-index: 2;
        }
        
        .main-btn {
            width: 100%;
            padding: 1.2rem;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
        }
        
        .main-btn:active {
            transform: scale(0.98);
        }
        
        .main-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Крипто челлендж */
        .crypto {
            position: absolute;
            bottom: 220px;
            left: 1.5rem;
            right: 1.5rem;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(0, 255, 136, 0.2);
            z-index: 2;
        }
        
        .crypto-title {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .crypto-question {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            color: #00ff88;
            margin-bottom: 1.5rem;
        }
        
        .crypto-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .crypto-btn {
            padding: 1.2rem;
            background: rgba(31, 31, 31, 0.8);
            border: 2px solid #333;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .crypto-btn:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }
        
        .crypto-btn:active {
            transform: scale(0.95);
        }
        
        .crypto-cooldown {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        
        /* Телефон с лентой */
        .phone-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }
        
        .phone {
            width: 360px;
            height: 720px;
            background: #000;
            border-radius: 40px;
            border: 8px solid #1a1a1a;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 28px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }
        
        .phone-content {
            height: 100%;
            overflow-y: auto;
            padding: 40px 1rem 1rem;
            scroll-behavior: smooth;
        }
        
        .phone-content::-webkit-scrollbar {
            display: none;
        }
        
        .feed-card {
            background: #161616;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #2a2a2a;
            animation: slideUp 0.3s ease-out;
        }
        
        .feed-emoji {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .feed-text {
            font-size: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            color: #ddd;
        }
        
        .feed-btns {
            display: flex;
            gap: 0.5rem;
        }
        
        .feed-btn {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid #333;
            background: transparent;
            color: #fff;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .feed-btn:hover {
            background: #222;
            border-color: #00ff88;
        }
        
        .feed-btn.trigger {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }
        
        .feed-hint {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin: 1rem 0;
            font-style: italic;
        }
        
        .close-phone {
            position: absolute;
            top: 50px;
            right: 1rem;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 11;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Экраны работы и навыков */
        .content-screen {
            padding: 1.5rem;
            padding-bottom: 100px;
            padding-top: 5rem;
            min-height: 100vh;
        }
        
        .screen-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }
        
        .card {
            background: #1f1f1f;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #2a2a2a;
        }
        
        .card-header {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }
        
        .card-value {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .card-desc {
            font-size: 0.9rem;
            color: #888;
            line-height: 1.5;
        }
        
        .progress {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 0.8rem 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #00ff88;
            transition: width 0.5s;
            border-radius: 4px;
        }
        
        .skill-item, .job-item {
            margin: 1rem 0;
            padding: 1.2rem;
            background: rgba(0, 255, 136, 0.05);
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .skill-item:hover, .job-item:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .item-name {
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .item-level {
            color: #888;
            font-size: 0.85rem;
        }
        
        .item-icon {
            font-size: 1.5rem;
        }
        
        .empty-state {
            text-align: center;
            color: #666;
            padding: 3rem 2rem;
            font-size: 1rem;
        }
        
        /* Экран навыка */
        .skill-screen {
            padding: 1.5rem;
            padding-bottom: 100px;
            padding-top: 5rem;
            min-height: 100vh;
        }
        
        .skill-top {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .skill-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .skill-title {
            font-size: 1.8rem;
            font-weight: 800;
        }
        
        .skill-progress {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .skill-lvl {
            font-size: 3rem;
            font-weight: 800;
            color: #00ff88;
        }
        
        .skill-xp {
            font-size: 1rem;
            color: #888;
            margin-top: 0.5rem;
        }
        
        .click-btn {
            width: 100%;
            padding: 2rem;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
            border: none;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }
        
        .click-btn:active {
            transform: scale(0.95);
        }
        
        .skill-status {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        
        .back-btn {
            display: block;
            margin: 0 auto;
            padding: 1rem 2rem;
            border: 2px solid #333;
            background: transparent;
            color: #fff;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Выбор первого курса */
        .course-selection {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
            padding: 2rem;
        }
        
        .course-box {
            background: #1f1f1f;
            border-radius: 20px;
            padding: 2rem;
            max-width: 360px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        
        .course-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .course-subtitle {
            font-size: 0.95rem;
            color: #888;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .course-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        
        .course-option {
            padding: 1.2rem;
            background: rgba(0, 255, 136, 0.05);
            border: 2px solid #333;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .course-option:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }
        
        .course-emoji {
            font-size: 2rem;
        }
        
        .course-name {
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        /* Навигация */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 420px;
            width: 100%;
            background: #1f1f1f;
            border-top: 1px solid #2a2a2a;
            display: flex;
            z-index: 100;
        }
        
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            padding: 0.8rem 0.5rem;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .nav-item.active {
            color: #00ff88;
        }
        
        .nav-icon {
            font-size: 1.5rem;
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="app"></div>

        };

        const courses = [
            { key: 'tech', emoji: '💻', name: 'Основы программирования' },
            { key: 'music', emoji: '🎵', name: 'Музыкальная теория' },
            { key: 'sport', emoji: '🏋️', name: 'Фитнес и тренировки' },
            { key: 'politics', emoji: '🏛️', name: 'Основы политологии' }
        ];

        // Утилиты
        function save() {
            localStorage.setItem('socialLift', JSON.stringify(state));
        }

        function load() {
            const saved = localStorage.getItem('socialLift');
            if (saved) {
                Object.assign(state, JSON.parse(saved));
            }
        }

        function getSkillName(key) {
            const names = { tech: 'Технологии', music: 'Музыка', sport: 'Спорт', politics: 'Политика' };
            return names[key];
        }

        function generateFeed() {
            // Первый раз в ленте - предлагаем выбор курса
            if (!state.firstCourseOffered) {
                state.firstCourseOffered = true;
                state.showCourseSelection = true;
                save();
                render();
                return null;
            }
            
            const rand = Math.random() * 100;
            if (rand < 50) {
                const item = feedData.trash[Math.floor(Math.random() * feedData.trash.length)];
                return { ...item, type: 'trash' };
            } else if (rand < 75) {
                const item = feedData.neutral[Math.floor(Math.random() * feedData.neutral.length)];
                return { ...item, type: 'neutral' };
            } else {
                const item = feedData.triggers[Math.floor(Math.random() * feedData.triggers.length)];
                return { ...item, type: 'trigger' };
            }
        }

        // Действия
        function startGame() {
            state.step = 0;
            state.screen = 'home';
            state.charge = 100;
            render();
        }

        function navigate(screen) {
            state.screen = screen;
            state.showPhone = false;
            render();
        }

        function openPhone() {
            if (state.charge < 5) return;
            state.showPhone = true;
            render();
        }

        function closePhone() {
            state.showPhone = false;
            render();
        }

        function selectCourse(key) {
            state.skills[key].unlocked = true;
            state.currentSkill = key;
            state.showCourseSelection = false;
            alert(`🎯 Отличный выбор! Ты начинаешь изучать: ${getSkillName(key)}`);
            render();
        }

        function feedAction(action, card) {
            state.charge = Math.max(0, state.charge - 2);
            state.degradation = Math.min(100, state.degradation + 3);
            
            if (card && card.type === 'trigger' && card.branch && !state.skills[card.branch].unlocked) {
                state.skills[card.branch].unlocked = true;
                alert(`🎯 Открыт путь: ${getSkillName(card.branch)}!`);
            }
            
            render();
        }

        function openSkill(key) {
            state.currentSkill = key;
            state.screen = 'skill';
            render();
        }

        function clickSkill() {
            const skill = state.skills[state.currentSkill];
            const efficiency = Math.max(0.2, 1 - state.degradation / 150);
            const xp = Math.floor((Math.random() * 3 + 2) * efficiency);
            
            skill.xp += xp;
            state.charge = Math.max(0, state.charge - 0.5);
            
            const needed = skill.level * 100 + 100;
            if (skill.xp >= needed) {
                skill.xp -= needed;
                skill.level++;
                
                // Открываем работы
                if (skill.level === 3 && state.jobs.length === 0) {
                    state.jobs.push({
                        id: 'moderation',
                        name: 'Модерация контента',
                        income: 50,
                        skill: state.currentSkill
                    });
                    alert(`🎉 Уровень ${skill.level}! Открыта работа: Модерация контента`);
                } else {
                    alert(`🎉 Уровень ${skill.level}! ${getSkillName(state.currentSkill)}`);
                }
                
                if (skill.level === 5) {
                    state.cryptoAvailable = true;
                    alert('📈 Открыт Crypto Challenge!');
                }
            }
            
            render();
        }

        function cryptoGuess(dir) {
            const actual = Math.random() > 0.5 ? 'up' : 'down';
            const win = dir === actual;
            
            if (win) {
                const bonus = Math.random() < 0.05 ? 10 : 1;
                const xp = 50 * bonus;
                if (state.currentSkill) {
                    state.skills[state.currentSkill].xp += xp;
                }
                state.cryptoStreak++;
                alert(bonus > 1 ? `🔥 x${bonus} БОНУС! +${xp} опыта!` : `✅ Угадал! +${xp} опыта`);
            } else {
                state.cryptoStreak = 0;
                alert('❌ Рынок показал характер.');
            }
            
            state.cryptoDate = new Date().toDateString();
            render();
        }

        function showStatus() {
            state.screen = 'status-detail';
            render();
        }

        // Рендер
        function render() {
            save();
            const app = document.getElementById('app');
            
            // Онбординг
            if (state.screen === 'onboarding') {
                if (state.step === 0) {
                    app.innerHTML = `
                        <div class="onboarding">
                            <div class="onboarding-text">Ты решил заняться трейдингом…</div>
                        </div>
                    `;
                    setTimeout(() => { state.step = 1; render(); }, 2000);
                } else if (state.step === 1) {
                    app.innerHTML = `
                        <div class="onboarding">
                            <div class="notification-box">
                                <div class="notification">
                                    <div class="notif-title">Binance</div>
                                    <div class="notif-text">Маржин-колл</div>
                                </div>
                                <div class="notification">
                                    <div class="notif-title">Binance</div>
                                    <div class="notif-text">Ликвидация позиции</div>
                                </div>
                                <div class="notification">
                                    <div class="notif-title">Telegram</div>
                                    <div class="notif-text">Бро, ты жив?</div>
                                </div>
                                <div class="notification">
                                    <div class="notif-title">Баланс</div>
                                    <div class="notif-text">0.00 USDT</div>
                                </div>
                            </div>
                        </div>
                    `;
                    setTimeout(() => { state.step = 2; render(); }, 3000);
                } else if (state.step === 2) {
                    app.innerHTML = `
                        <div class="onboarding">
                            <div class="onboarding-text">…и рынок решил иначе.</div>
                        </div>
                    `;
                    setTimeout(() => { state.step = 3; render(); }, 2000);
                } else {
                    app.innerHTML = `
                        <div class="onboarding">
                            <div style="font-size: 6rem; margin-bottom: 2rem;">📦</div>
                            <div class="onboarding-text">Добро пожаловать обратно в реальность.</div>
                            <div style="font-size: 0.9rem; color: #666; margin-top: 1rem;">
                                Зато опыт есть. 😄
                            </div>
                            <button class="start-btn" onclick="startGame()">Начать заново</button>
                        </div>
                    `;
                }
                return;
            }
            
            // Экран навыка
            if (state.screen === 'skill') {
                const skill = state.skills[state.currentSkill];
                const needed = skill.level * 100 + 100;
                const percent = (skill.xp / needed) * 100;
                const icons = { tech: '💻', music: '🎵', sport: '🏋️', politics: '🏛️' };
                
                app.innerHTML = `
                    <div class="skill-screen">
                        <div class="skill-top">
                            <div class="skill-icon">${icons[state.currentSkill]}</div>
                            <div class="skill-title">${getSkillName(state.currentSkill)}</div>
                        </div>
                        <div class="skill-progress">
                            <div class="skill-lvl">${skill.level}</div>
                            <div class="skill-xp">${Math.floor(skill.xp)} / ${needed} опыта</div>
                            <div class="progress" style="margin-top: 1rem;">
                                <div class="progress-fill" style="width: ${percent}%"></div>
                            </div>
                        </div>
                        <button class="click-btn" onclick="clickSkill()">ИЗУЧАТЬ</button>
                        <div class="skill-status">
                            ${state.degradation > 50 ? '⚠️ Высокая деградация замедляет обучение' : 
                              state.hunger > 70 ? '⚠️ Голод снижает эффективность' :
                              '✓ Продолжай в том же духе'}
                        </div>
                        <button class="back-btn" onclick="navigate('skills')">← Назад к навыкам</button>
                    </div>
                `;
                return;
            }
            
            // Детальный статус
            if (state.screen === 'status-detail') {
                app.innerHTML = `
                    <div class="content-screen">
                        <div class="screen-title">Твой статус</div>
                        <div class="card">
                            <div class="card-header">КТО ТЫ</div>
                            <div class="card-value">
                                ${state.level < 5 ? 'Уличный новичок' :
                                  state.level < 15 ? 'Начинающий' : 'Опытный'}
                            </div>
                            <div class="card-desc">
                                ${state.home === 'none' ? 'Без дома. Без денег. С телефоном.' : 'Уже не на улице. Есть прогресс.'}
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header">ПАРАМЕТРЫ</div>
                            <div style="margin: 0.8rem 0;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                    <span style="color: #888;">Концентрация</span>
                                    <span style="font-weight: 700;">${Math.floor(state.concentration)}%</span>
                                </div>
                                <div class="progress">
                                    <div class="progress-fill" style="width: ${state.concentration}%"></div>
                                </div>
                            </div>
                            <div style="margin: 0.8rem 0;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                    <span style="color: #888;">Хаос</span>
                                    <span style="font-weight: 700;">${Math.floor(state.chaos)}%</span>
                                </div>
                                <div class="progress">
                                    <div class="progress-fill" style="width: ${state.chaos}%; background: #ff4444;"></div>
                                </div>
                            </div>
                        </div>
                        <button class="back-btn" style="margin-top: 2rem;" onclick="navigate('home')">← На главную</button>
                    </div>
                    ${renderNav()}
                `;
                return;
            }
            
            // Основные экраны
            const topStatus = `
                <div class="top-status" onclick="showStatus()">
                    <div class="status-item">
                        <span class="status-icon">🍔</span>
                        <span>${Math.max(0, 100 - state.hunger)}%</span>
                    </div>
                    <div class="status-item">
                        <span class="status-icon">🔋</span>
                        <span>${Math.floor(state.charge)}%</span>
                    </div>
                    <div class="status-item">
                        <span class="status-icon">⭐</span>
                        <span>${state.level}</span>
                    </div>
                </div>
            `;
            
            if (state.screen === 'home') {
                const scene = scenes[state.home];
                const canOpen = state.charge > 5;
                const cryptoToday = state.cryptoDate === new Date().toDateString();
                
                app.innerHTML = `
                    ${topStatus}
                    <div class="scene">
                        <div class="scene-photo"></div>
                        <div class="scene-content">
                            <div class="scene-title">${scene.title}</div>
                            <div class="scene-desc">${scene.desc}</div>
                            <div class="scene-hint">${scene.hint}</div>
                        </div>
                    </div>
                    ${state.cryptoAvailable && !cryptoToday ? `
                        <div class="crypto">
                            <div class="crypto-title">📈 Crypto Challenge</div>
                            <div class="crypto-question">BTC сегодня?</div>
                            <div class="crypto-btns">
                                <button class="crypto-btn" onclick="cryptoGuess('up')">⬆ Вверх</button>
                                <button class="crypto-btn" onclick="cryptoGuess('down')">⬇ Вниз</button>
                            </div>
                            <div class="crypto-cooldown">
                                ${state.cryptoStreak > 0 ? `Серия: ${state.cryptoStreak} 🔥` : 'А вдруг сегодня твой день 😏'}
                            </div>
                        </div>
                    ` : ''}
                    <div class="action-area">
                        <button class="main-btn" ${!canOpen ? 'disabled' : ''} onclick="openPhone()">
                            ${canOpen ? 'ОТКРЫТЬ ЛЕНТУ' : 'Недостаточно заряда'}
                        </button>
                    </div>
                    ${renderNav()}
                `;
            } else if (state.screen === 'skills') {
                const unlocked = Object.entries(state.skills).filter(([_, s]) => s.unlocked);
                
                app.innerHTML = `
                    ${topStatus}
                    <div class="content-screen">
                        <div class="screen-title">Навыки</div>
                        ${unlocked.length > 0 ? unlocked.map(([key, skill]) => {
                            const icons = { tech: '💻', music: '🎵', sport: '🏋️', politics: '🏛️' };
                            return `
                                <div class="skill-item" onclick="openSkill('${key}')">
                                    <div class="item-header">
                                        <div>
                                            <div class="item-name">${getSkillName(key)}</div>
                                            <div class="item-level">Уровень ${skill.level}</div>
                                        </div>
                                        <div class="item-icon">${icons[key]}</div>
                                    </div>
                                    <div class="progress">
                                        <div class="progress-fill" style="width: ${(skill.xp / (skill.level * 100 + 100)) * 100}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('') : `
                            <div class="empty-state">
                                Открой навыки через ленту<br>
                                <button class="main-btn" style="margin-top: 1rem;" onclick="openPhone()">Открыть ленту</button>
                            </div>
                        `}
                    </div>
                    ${renderNav()}
                `;
            } else if (state.screen === 'jobs') {
                app.innerHTML = `
                    ${topStatus}
                    <div class="content-screen">
                        <div class="screen-title">Работа</div>
                        ${state.jobs.length > 0 ? state.jobs.map(job => `
                            <div class="job-item">
                                <div class="item-header">
                                    <div>
                                        <div class="item-name">${job.name}</div>
                                        <div class="item-level">Доход: ${job.income}₽/час</div>
                                    </div>
                                    <div class="item-icon">💼</div>
                                </div>
                            </div>
                        `).join('') : `
                            <div class="empty-state">
                                Прокачай навыки до уровня 3<br>чтобы открыть работу
                            </div>
                        `}
                    </div>
                    ${renderNav()}
                `;
            }
            
            // Телефон с лентой
            if (state.showPhone) {
                const phoneOverlay = document.createElement('div');
                phoneOverlay.className = 'phone-overlay';
                phoneOverlay.innerHTML = renderPhone();
                app.appendChild(phoneOverlay);
            }
            
            // Выбор курса
            if (state.showCourseSelection) {
                const courseOverlay = document.createElement('div');
                courseOverlay.className = 'course-selection';
                courseOverlay.innerHTML = `
                    <div class="course-box">
                        <div class="course-title">Бесплатный курс!</div>
                        <div class="course-subtitle">Выбери направление для изучения</div>
                        <div class="course-list">
                            ${courses.map(course => `
                                <div class="course-option" onclick="selectCourse('${course.key}')">
                                    <div class="course-emoji">${course.emoji}</div>
                                    <div class="course-name">${course.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                app.appendChild(courseOverlay);
            }
        }
        
        function renderPhone() {
            const cards = [];
            for (let i = 0; i < 5; i++) {
                const card = generateFeed();
                if (card) cards.push(card);
            }
            
            return `
                <div class="phone">
                    <div class="phone-notch"></div>
                    <button class="close-phone" onclick="closePhone()">✕</button>
                    <div class="phone-content">
                        ${cards.map(card => `
                            <div class="feed-card">
                                <div class="feed-emoji">${card.emoji}</div>
                                <div class="feed-text">${card.text}</div>
                                <div class="feed-btns">
                                    ${card.type === 'trigger' ? `
                                        <button class="feed-btn trigger" onclick='feedAction("open", ${JSON.stringify(card).replace(/'/g, "&apos;")})'>ОТКРЫТЬ</button>
                                    ` : `
                                        <button class="feed-btn" onclick='feedAction("fa", ${JSON.stringify(card).replace(/'/g, "&apos;")})'>ФА</button>
                                        <button class="feed-btn" onclick='feedAction("pepe", ${JSON.stringify(card).replace(/'/g, "&apos;")})'>ПЭПЭ</button>
                                        <button class="feed-btn" onclick='feedAction("schnela", ${JSON.stringify(card).replace(/'/g, "&apos;")})'>ШНЕЛЯ</button>
                                    `}
                                </div>
                            </div>
                        `).join('')}
                        <div class="feed-hint">
                            ${state.degradation > 60 ? 'Голова гудит...' : 
                              state.degradation > 30 ? 'Ты листаешь снова.' : 
                              'Время идёт.'}
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderNav() {
            return `
                <div class="nav">
                    <button class="nav-item ${state.screen === 'home' ? 'active' : ''}" onclick="navigate('home')">
                        <div class="nav-icon">🏠</div>
                        HOME
                    </button>
                    <button class="nav-item ${state.screen === 'skills' ? 'active' : ''}" onclick="navigate('skills')">
                        <div class="nav-icon">📚</div>
                        НАВЫКИ
                    </button>
                    <button class="nav-item ${state.screen === 'jobs' ? 'active' : ''}" onclick="navigate('jobs')">
                        <div class="nav-icon">💼</div>
                        РАБОТА
                    </button>
                    <button class="nav-item" style="opacity: 0.3;">
                        <div class="nav-icon">🏢</div>
                        БИЗНЕС
                    </button>
                </div>
            `;
        }

        // Запуск
        window.onload = () => {
            load();
            render();
        };
    </script>
</body>
</html>
